<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRE Gerencial — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script src="erp-core.js"></script>
    <script src="erp-print.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        /* BLINDAGEM LGPD ABSOLUTA: Oculta o seletor por defeito. Só aparece se o body tiver a classe 'usuario-master' */
        body:not(.usuario-master) .empresa-selector {
            display: none !important;
            visibility: hidden !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .container { max-width: 1280px; margin: 40px auto; padding: 0 24px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 28px; }

        /* BARRA DE FERRAMENTAS E ABAS DE PERÍODO */
        .dre-toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .periodo-tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-btn { background: transparent; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text-light); cursor: pointer; transition: 0.2s; }
        .tab-btn.ativo { background: var(--primary); color: #fff; box-shadow: 0 2px 5px rgba(37,99,235,0.2); }

        .filtro-mes { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        .filtro-mes input { height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; color: var(--text-main); font-weight: 600; outline: none; cursor: pointer; }
        .filtro-mes input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn-acao { background: var(--success); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 2px 6px rgba(16,185,129,0.2); }
        .btn-acao:hover { background: #059669; }

        /* TABELA DRE CONTÁBIL ESTRUTURADA */
        .card-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        thead th { background: var(--bg); text-align: left; padding: 12px 16px; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); letter-spacing: 0.5px; }
        tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        tbody tr:hover { background: #f8fafc; }
        
        .row-grupo { background: var(--bg); font-weight: 700; color: var(--secondary); }
        .row-sub { padding-left: 36px !important; color: var(--text-light); font-size: 13px; }
        .row-total { font-weight: 800; background: #f1f5f9; color: var(--secondary); border-top: 2px solid var(--border); }
        .row-lucro { font-weight: 800; background: #d1fae5 !important; color: #065f46; font-size: 15px; border-top: 2px solid var(--success); }
        
        .row-prejuizo { font-weight: 800; background: #fee2e2 !important; color: #991b1b; font-size: 15px; border-top: 2px solid var(--danger); }
        .vazio { text-align: center; color: var(--text-light); padding: 32px; font-weight: 500; }
        .num { text-align: right; }

        .base-sel { height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; background: #fff; color: var(--text-main); font-weight: 600; outline: none; cursor: pointer; }
        .nota-dre { margin-top: 16px; font-size: 12px; color: var(--text-light); line-height: 1.6; border-left: 3px solid var(--border); padding-left: 12px; }
        .nota-dre b { color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">

    <!-- BARRA DE FERRAMENTAS E ABAS DE PERÍODO -->
    <div class="dre-toolbar">
        <div class="periodo-tabs">
            <button type="button" class="tab-btn ativo" id="tabMensal" onclick="selecionarPeriodo('mensal')">Mensal</button>
            <button type="button" class="tab-btn" id="tabAcumulado" onclick="selecionarPeriodo('acumulado')">Acumulado (Jan até Mês)</button>
            <button type="button" class="tab-btn" id="tabAnual" onclick="selecionarPeriodo('anual')">Anual</button>
        </div>
        <div class="filtro-mes">
            <span>Mês de Referência:</span>
            <input type="month" id="filtroMes" onchange="carregarDRE()">
        </div>
        <div class="filtro-mes">
            <span>Base:</span>
            <select id="filtroBase" class="base-sel" onchange="carregarDRE()">
                <option value="todos">Todos os títulos (pagos e a pagar)</option>
                <option value="liquidados">Somente pagos / recebidos</option>
            </select>
        </div>
        <button type="button" class="btn-acao" onclick="executarImpressao()"><i class="fas fa-print"></i> Imprimir DRE</button>
    </div>

    <!-- TABELA DRE PRINCIPAL -->
    <div class="card-table">
        <div class="table-header">
            <div>
                <h3 style="font-size:18px; font-weight:800; color:var(--secondary);">Estrutura de Resultados</h3>
                <p style="font-size:12px; color:var(--text-light); margin-top:2px;">Demonstrativo analítico e sintético da apuração do exercício.</p>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Conta / Descrição Contábil</th>
                    <th class="num">Valor no Período (R$)</th>
                </tr>
            </thead>
            <tbody id="tbodyDRE">
                <tr><td colspan="2" class="vazio">A carregar dados contábeis do Supabase...</td></tr>
            </tbody>
        </table>
        <div class="nota-dre" id="notaDRE"></div>
    </div>

</div>

<script>
    const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co', 'sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
    const EMAIL_MASTER = "lucianojorgesacramento@gmail.com";
    let periodoAtual = 'mensal';
    let ultimoDRE = null;

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
    function obterUsuario() {
        try { return JSON.parse(localStorage.getItem('usuarioLogado') || 'null'); } catch(e) { return null; }
    }
    function ehMaster() {
        const u = obterUsuario();
        if (!u || !u.email) return false;
        return u.email.toLowerCase().trim() === EMAIL_MASTER.toLowerCase().trim();
    }
    function clienteIdAtual() {
        const u = obterUsuario();
        if (!u) return 1;
        if (ehMaster()) {
            try { const sel = localStorage.getItem('empresaSelecionada'); if (sel) return parseInt(sel); } catch(e) {}
            return u.cliente_id ? parseInt(u.cliente_id) : 2;
        }
        return u.cliente_id ? parseInt(u.cliente_id) : 2;
    }
    function numero(v) {
        if (typeof v === 'number') return v;
        let s = String(v === null || v === undefined ? '' : v).trim();
        if (!s) return 0;
        if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
    }
    function formatarMoeda(valor) {
        const n = Math.round((Number(valor) || 0) * 100) / 100;
        return (n < 0 ? '-R$ ' : 'R$ ') + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function selecionarPeriodo(tipo) {
        periodoAtual = tipo;
        document.getElementById('tabMensal').classList.toggle('ativo', tipo === 'mensal');
        document.getElementById('tabAcumulado').classList.toggle('ativo', tipo === 'acumulado');
        document.getElementById('tabAnual').classList.toggle('ativo', tipo === 'anual');
        carregarDRE();
    }

    if (!document.getElementById('filtroMes').value) {
        const agora = new Date();
        document.getElementById('filtroMes').value = agora.getFullYear() + '-' + String(agora.getMonth() + 1).padStart(2, '0');
    }

    // Lê TODAS as linhas do período (o Supabase entrega no máximo 1000 por consulta)
    async function lerPeriodo(tabela, ini, fimExclusivo) {
        const out = []; const PAG = 1000;
        for (let pos = 0; pos < 200000; pos += PAG) {
            const r = await sb.from(tabela).select('*').eq('cliente_id', clienteIdAtual())
                .gte('vencimento', ini).lt('vencimento', fimExclusivo).order('id', { ascending: true }).range(pos, pos + PAG - 1);
            if (r.error) throw new Error(r.error.message);
            out.push.apply(out, r.data || []);
            if (!r.data || r.data.length < PAG) break;
        }
        return out;
    }

    function ehDeducao(conta, ehReceita) {
        const c = norm(conta);
        return c.startsWith('1.2') || c.indexOf('simples') >= 0 || (ehReceita ? c.indexOf('dedu') >= 0 : /\bdas\b/.test(c));
    }
    function ehCPV(conta) {
        const c = norm(conta);
        return c.startsWith('3.1') || c.indexOf('cpv') >= 0 || c.indexOf('insumos') >= 0;
    }

    function calcularDRE(recebimentos, pagamentos, base) {
        const R = { bruta: 0, deducoes: 0, cpv: 0, despesas: 0, dRec: {}, dDed: {}, dCpv: {}, dDesp: {},
                    qtd: 0, pendRec: 0, pendPag: 0, qtdPend: 0, semConta: 0, qtdSemConta: 0, cancelados: 0 };
        const SEM = 'Sem conta contábil informada (classificar)';
        function estado(st) { const s = norm(st); return { cancel: s.indexOf('cancel') >= 0 || s.indexOf('estorn') >= 0, liq: s.indexOf('pago') >= 0 || s.indexOf('recebido') >= 0 || s.indexOf('quitado') >= 0 }; }

        recebimentos.forEach(r => {
            const e = estado(r.status);
            if (e.cancel) { R.cancelados++; return; }
            if (base === 'liquidados' && !e.liq) return;
            const val = numero(r.valor);
            R.qtd++;
            if (!e.liq) { R.pendRec += val; R.qtdPend++; }
            let conta = String(r.conta_contabil || '').trim();
            if (!conta) { conta = SEM; R.semConta += val; R.qtdSemConta++; }
            if (ehDeducao(conta, true)) { R.deducoes += val; R.dDed[conta] = (R.dDed[conta] || 0) + val; }
            else { R.bruta += val; R.dRec[conta] = (R.dRec[conta] || 0) + val; }
        });

        pagamentos.forEach(p => {
            const e = estado(p.status);
            if (e.cancel) { R.cancelados++; return; }
            if (base === 'liquidados' && !e.liq) return;
            const val = numero(p.valor);
            R.qtd++;
            if (!e.liq) { R.pendPag += val; R.qtdPend++; }
            let conta = String(p.conta_contabil || '').trim();
            if (!conta) { conta = SEM; R.semConta += val; R.qtdSemConta++; }
            if (ehDeducao(conta, false)) { R.deducoes += val; R.dDed[conta] = (R.dDed[conta] || 0) + val; }
            else if (ehCPV(conta)) { R.cpv += val; R.dCpv[conta] = (R.dCpv[conta] || 0) + val; }
            else { R.despesas += val; R.dDesp[conta] = (R.dDesp[conta] || 0) + val; }
        });

        R.receitaLiquida = R.bruta - R.deducoes;
        R.lucroBruto = R.receitaLiquida - R.cpv;
        R.resultadoOperacional = R.lucroBruto - R.despesas;
        R.lucroLiquido = R.resultadoOperacional;

        // linhas na ordem do demonstrativo: tipo = grupo | sub | total | lucro
        const L = [];
        function sub(det) { Object.keys(det).sort().forEach(c => L.push({ t: 'sub', r: '• ' + c, v: det[c] })); }
        L.push({ t: 'grupo', r: '(+) RECEITA BRUTA DE VENDAS E SERVIÇOS', v: R.bruta }); sub(R.dRec);
        L.push({ t: 'grupo', r: '(-) DEDUÇÕES E ABATIMENTOS (Simples Nacional / DAS)', v: R.deducoes, neg: true }); sub(R.dDed);
        L.push({ t: 'total', r: '(=) RECEITA LÍQUIDA', v: R.receitaLiquida });
        L.push({ t: 'grupo', r: '(-) CUSTOS DOS SERVIÇOS PRESTADOS OU PRODUTOS VENDIDOS (CPV)', v: R.cpv, neg: true }); sub(R.dCpv);
        L.push({ t: 'total', r: '(=) LUCRO BRUTO', v: R.lucroBruto });
        L.push({ t: 'grupo', r: '(-) DESPESAS OPERACIONAIS (Adm, P&D, Aluguel, Salários)', v: R.despesas, neg: true }); sub(R.dDesp);
        L.push({ t: 'total', r: '(=) RESULTADO OPERACIONAL', v: R.resultadoOperacional });
        L.push({ t: 'lucro', r: R.lucroLiquido < 0 ? '(=) PREJUÍZO DO EXERCÍCIO' : '(=) LUCRO LÍQUIDO DO EXERCÍCIO (LLE)', v: R.lucroLiquido });
        R.linhas = L;
        return R;
    }

    function notasDRE(R, base, label) {
        const n = [];
        n.push('<b>Base de apuração:</b> data de vencimento dos títulos de Contas a Pagar e a Receber (' + (base === 'liquidados' ? 'somente os já pagos / recebidos' : 'todos os títulos do período, pagos ou não') + '). Títulos cancelados ou estornados não entram.');
        if (base !== 'liquidados' && R.qtdPend > 0) n.push('Inclui <b>' + R.qtdPend + '</b> título(s) ainda não liquidado(s): receitas a receber ' + formatarMoeda(R.pendRec) + ' e despesas a pagar ' + formatarMoeda(R.pendPag) + '.');
        if (R.qtdSemConta > 0) n.push('<b>' + R.qtdSemConta + '</b> título(s) sem conta contábil (' + formatarMoeda(R.semConta) + ') foram agrupados em "Sem conta contábil informada". Classifique-os em Contas a Pagar/Receber para o DRE ficar completo.');
        n.push('Este é um demonstrativo gerencial; não substitui a escrituração contábil oficial.');
        return n;
    }

    async function carregarDRE() {
        const mesAno = document.getElementById('filtroMes').value;
        if (!mesAno) return;
        const base = document.getElementById('filtroBase').value;
        const ano = parseInt(mesAno.split('-')[0]);
        const mes = parseInt(mesAno.split('-')[1]);
        const p2 = n => String(n).padStart(2, '0');
        let ini, fimEx, label;
        if (periodoAtual === 'mensal') {
            ini = ano + '-' + p2(mes) + '-01';
            fimEx = (mes === 12 ? (ano + 1) + '-01-01' : ano + '-' + p2(mes + 1) + '-01');
            label = 'Mês de ' + p2(mes) + '/' + ano;
        } else if (periodoAtual === 'acumulado') {
            ini = ano + '-01-01';
            fimEx = (mes === 12 ? (ano + 1) + '-01-01' : ano + '-' + p2(mes + 1) + '-01');
            label = 'Acumulado de Jan/' + ano + ' até ' + p2(mes) + '/' + ano;
        } else {
            ini = ano + '-01-01'; fimEx = (ano + 1) + '-01-01';
            label = 'Exercício de ' + ano + ' (Anual)';
        }

        try {
            const [rec, pag] = await Promise.all([lerPeriodo('contas_receber', ini, fimEx), lerPeriodo('contas_pagar', ini, fimEx)]);
            const R = calcularDRE(rec, pag, base);
            ultimoDRE = { R: R, base: base, label: label };

            let html = '';
            R.linhas.forEach(l => {
                const cor = l.neg ? ' style="color:var(--danger);"' : '';
                if (l.t === 'sub') html += '<tr><td class="row-sub">' + esc(l.r) + '</td><td class="num">' + formatarMoeda(l.v) + '</td></tr>';
                else html += '<tr class="' + (l.t === 'grupo' ? 'row-grupo' : (l.t === 'total' ? 'row-total' : (l.v < 0 ? 'row-prejuizo' : 'row-lucro'))) + '"><td>' + esc(l.r) + '</td><td class="num"' + cor + '>' + formatarMoeda(l.v) + '</td></tr>';
            });
            document.getElementById('tbodyDRE').innerHTML = html;
            document.getElementById('notaDRE').innerHTML = '<b>Período:</b> ' + esc(label) + '<br>' + notasDRE(R, base, label).join('<br>');
        } catch (err) {
            ultimoDRE = null;
            document.getElementById('tbodyDRE').innerHTML = '<tr><td colspan="2" class="vazio" style="color:var(--danger);">Erro ao carregar o DRE: ' + esc(err.message) + '. Atualize a página (Ctrl+F5).</td></tr>';
            document.getElementById('notaDRE').innerHTML = '';
        }
    }

    function executarImpressao() {
        if (!window.ERPPrint) { alert('Módulo de impressão não carregado. Atualize a página (Ctrl+F5).'); return; }
        if (!ultimoDRE) { alert('Aguarde o carregamento do DRE.'); return; }
        const R = ultimoDRE.R, B = ERPPrint.fmtBRL;
        const fm = v => (Number(v) < 0 ? '-' : '') + B(Math.abs(Number(v) || 0));
        const linhas = R.linhas.map(l => {
            if (l.t === 'sub') return [{ t: '      ' + l.r, cls: 'muted' }, { t: fm(l.v), cls: 'muted' }];
            if (l.t === 'grupo') return { c: [{ t: l.r, cls: 'bold' }, { t: fm(l.v), cls: 'bold' }] };
            const cls = (l.t === 'lucro') ? (l.v < 0 ? 'neg' : 'pos') : 'bold';
            return { c: [{ t: l.r, cls: cls }, { t: fm(l.v), cls: cls }], cls: 'destaque' };
        });
        const notas = notasDRE(R, ultimoDRE.base, ultimoDRE.label).map(x => x.replace(/<\/?b>/g, ''));
        ERPPrint.imprimir({
            titulo: 'Demonstração do Resultado do Exercício (DRE Gerencial)',
            subtitulo: ultimoDRE.label,
            codigo: 'FIN-DRE',
            orientacao: 'portrait',
            filtros: [['Período', ultimoDRE.label], ['Base', ultimoDRE.base === 'liquidados' ? 'Somente pagos / recebidos' : 'Todos os títulos (por vencimento)']],
            resumo: [['Receita líquida', fm(R.receitaLiquida)], ['Lucro bruto', fm(R.lucroBruto)], ['Resultado operacional', fm(R.resultadoOperacional)], [R.lucroLiquido < 0 ? 'Prejuízo do exercício' : 'Lucro líquido', fm(R.lucroLiquido)]],
            colunas: [{ t: 'Conta / Descrição contábil', w: 4 }, { t: 'Valor no período (R$)', w: 1.5, a: 'right' }],
            linhas: linhas,
            observacao: notas.join(' '),
            assinaturas: ['Contador responsável', 'Sócio / Administrador']
        });
    }

    async function inicializarPagina() {
        const u = obterUsuario();
        if (!u || !u.email) { location.href = 'login.html'; return; }
        if (ehMaster()) document.body.classList.add('usuario-master');
        carregarDRE();
    }

    window.onload = inicializarPagina;
</script>
</body>
</html>
