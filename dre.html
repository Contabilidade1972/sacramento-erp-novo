<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRE Gerencial — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script src="erp-core.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .container { max-width: 1280px; margin: 40px auto; padding: 0 24px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 28px; }

        /* BARRA DE FERRAMENTAS E ABAS DE PERÍODO */
        .dre-toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .periodo-tabs { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-btn { background: transparent; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--text-light); cursor: pointer; transition: 0.2s; }
        .tab-btn.ativo { background: var(--primary); color: #fff; box-shadow: 0 2px 5px rgba(37,99,235,0.2); }

        .filtro-mes { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-light); text-transform: uppercase; }
        .filtro-mes input { height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; color: var(--text-main); font-weight: 600; outline: none; cursor: pointer; }
        .filtro-mes input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn-acao { background: var(--success); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 2px 6px rgba(16,185,129,0.2); }
        .btn-acao:hover { background: #059669; }

        /* TABELA DRE CONTÁBIL ESTRUTURADA */
        .card-table { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

        table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        thead th { background: var(--bg); text-align: left; padding: 12px 16px; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); letter-spacing: 0.5px; }
        tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        tbody tr:hover { background: #f8fafc; }
        
        .row-grupo { background: var(--bg); font-weight: 700; color: var(--secondary); }
        .row-sub { padding-left: 36px !important; color: var(--text-light); font-size: 13px; }
        .row-total { font-weight: 800; background: #f1f5f9; color: var(--secondary); border-top: 2px solid var(--border); }
        .row-lucro { font-weight: 800; background: #d1fae5 !important; color: #065f46; font-size: 15px; border-top: 2px solid var(--success); }
        
        .vazio { text-align: center; color: var(--text-light); padding: 32px; font-weight: 500; }
        .num { text-align: right; }

        .print-header { display: none; }

        @media print {
            .site-header, .dre-toolbar, .btn-acao { display: none !important; }
            body { background: #fff !important; }
            .card-table { border: none !important; box-shadow: none !important; padding: 0 !important; }
            table { width: 100% !important; border: 1px solid #cbd5e1 !important; margin-top: 15px; }
            thead th { background: #f1f5f9 !important; color: #0f172a !important; border-bottom: 2px solid #0f172a !important; }
            .print-header { display: block !important; border-bottom: 2px solid #1e3a8a; padding-bottom: 15px; margin-bottom: 20px; }
            .print-header h2 { font-size: 18px; color: #1e3a8a; font-weight: 800; text-transform: uppercase; }
            .print-header p { font-size: 11px; color: #64748b; margin-top: 4px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- BARRA DE FERRAMENTAS E ABAS DE PERÍODO -->
    <div class="dre-toolbar">
        <div class="periodo-tabs">
            <button class="tab-btn ativo" id="tabMensal" onclick="selecionarPeriodo('mensal')">Mensal</button>
            <button class="tab-btn" id="tabAcumulado" onclick="selecionarPeriodo('acumulado')">Acumulado (Jan até Mês)</button>
            <button class="tab-btn" id="tabAnual" onclick="selecionarPeriodo('anual')">Anual</button>
        </div>
        <div class="filtro-mes">
            <span>Mês de Referência:</span>
            <input type="month" id="filtroMes" onchange="carregarDRE()">
        </div>
        <button class="btn-acao" onclick="window.print()"><i class="fas fa-print"></i> Imprimir DRE</button>
    </div>

    <!-- TABELA DRE PRINCIPAL -->
    <div class="card-table">
        <div class="print-header">
            <h2>Demonstrativo do Resultado do Exercício (DRE Gerencial)</h2>
            <p>Período: <span id="printPeriodo">--</span> | Emitido via Sacramento ERP</p>
        </div>
        <div class="table-header">
            <div>
                <h3 style="font-size:18px; font-weight:800; color:var(--secondary);">Estrutura de Resultados</h3>
                <p style="font-size:12px; color:var(--text-light); margin-top:2px;">Demonstrativo analítico e sintético da apuração do exercício.</p>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Conta / Descrição Contábil</th>
                    <th class="num">Valor no Período (R$)</th>
                </tr>
            </thead>
            <tbody id="tbodyDRE">
                <tr><td colspan="2" class="vazio">A carregar dados contábeis do Supabase...</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co', 'sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
    let periodoAtual = 'mensal';

    function clienteIdAtual() {
        try { const sel = localStorage.getItem('empresaSelecionada'); if (sel) return parseInt(sel); } catch(e) {}
        try { const u = JSON.parse(localStorage.getItem('usuarioLogado') || 'null'); if (u && u.cliente_id) return u.cliente_id; } catch(e) {}
        return 1;
    }

    function formatarMoeda(valor) {
        let num = parseFloat(valor) || 0;
        return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function selecionarPeriodo(tipo) {
        periodoAtual = tipo;
        document.getElementById('tabMensal').classList.toggle('ativo', tipo === 'mensal');
        document.getElementById('tabAcumulado').classList.toggle('ativo', tipo === 'acumulado');
        document.getElementById('tabAnual').classList.toggle('ativo', tipo === 'anual');
        carregarDRE();
    }

    // Inicializa o input de mês com o mês atual (ex: 2026-09) se estiver vazio
    if (!document.getElementById('filtroMes').value) {
        const agora = new Date();
        const ano = agora.getFullYear();
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        document.getElementById('filtroMes').value = `${ano}-${mes}`;
    }

    async function carregarDRE() {
        const cid = clienteIdAtual();
        let mesAno = document.getElementById('filtroMes').value;
        if (!mesAno) return;

        let ano = mesAno.split('-')[0];
        let mes = mesAno.split('-')[1];
        let prefixoVenc;
        let labelPeriodo;

        if (periodoAtual === 'mensal') {
            prefixoVenc = `${mesAno}%`;
            labelPeriodo = `Mês de ${mes}/${ano}`;
        } else if (periodoAtual === 'acumulado') {
            prefixoVenc = `${ano}%`;
            labelPeriodo = `Acumulado de Jan/${ano} até ${mes}/${ano}`;
        } else {
            prefixoVenc = `${ano}%`;
            labelPeriodo = `Exercício de ${ano} (Anual)`;
        }

        document.getElementById('printPeriodo').innerText = labelPeriodo;

        try {
            const [recRes, pagRes] = await Promise.all([
                sb.from('contas_receber').select('*').eq('cliente_id', cid).ilike('vencimento', prefixoVenc),
                sb.from('contas_pagar').select('*').eq('cliente_id', cid).ilike('vencimento', prefixoVenc)
            ]);

            const recebimentos = recRes.data || [];
            const pagamentos = pagRes.data || [];

            let totalReceitaBruta = 0;
            let totalDeducoes = 0;
            let totalCPV = 0;
            let totalDespesas = 0;
            let detalheReceitas = {};
            let detalheDeducoes = {};
            let detalheCPV = {};
            let detalheDespesas = {};

            recebimentos.forEach(r => {
                if (periodoAtual === 'acumulado') {
                    let vencMes = (r.vencimento || '').split('-')[1];
                    if (vencMes && parseInt(vencMes) > parseInt(mes)) return;
                }
                let val = parseFloat(r.valor) || 0;
                let conta = r.conta_contabil || '1.1.001 - Receita Bruta de Vendas';
                if (conta.startsWith('1.2') || conta.toLowerCase().includes('simples') || conta.toLowerCase().includes('dedu')) {
                    totalDeducoes += val;
                    detalheDeducoes[conta] = (detalheDeducoes[conta] || 0) + val;
                } else {
                    totalReceitaBruta += val;
                    detalheReceitas[conta] = (detalheReceitas[conta] || 0) + val;
                }
            });

            pagamentos.forEach(p => {
                if (periodoAtual === 'acumulado') {
                    let vencMes = (p.vencimento || '').split('-')[1];
                    if (vencMes && parseInt(vencMes) > parseInt(mes)) return;
                }
                let val = parseFloat(p.valor) || 0;
                let conta = p.conta_contabil || '4.1.001 - Despesas Operacionais';
                if (conta.startsWith('1.2') || conta.toLowerCase().includes('simples') || conta.toLowerCase().includes('das')) {
                    totalDeducoes += val;
                    detalheDeducoes[conta] = (detalheDeducoes[conta] || 0) + val;
                } else if (conta.startsWith('3.1') || conta.toLowerCase().includes('cpv') || conta.toLowerCase().includes('insumos')) {
                    totalCPV += val;
                    detalheCPV[conta] = (detalheCPV[conta] || 0) + val;
                } else {
                    totalDespesas += val;
                    detalheDespesas[conta] = (detalheDespesas[conta] || 0) + val;
                }
            });

            let receitaLiquida = totalReceitaBruta - totalDeducoes;
            let lucroBruto = receitaLiquida - totalCPV;
            let resultadoOperacional = lucroBruto - totalDespesas;
            let lucroLiquido = resultadoOperacional;

            let html = '';
            html += `<tr class="row-grupo"><td>(+) RECEITA BRUTA DE VENDAS E SERVIÇOS</td><td class="num">${formatarMoeda(totalReceitaBruta)}</td></tr>`;
            for (let c in detalheReceitas) {
                html += `<tr><td class="row-sub">• ${c}</td><td class="num">${formatarMoeda(detalheReceitas[c])}</td></tr>`;
            }

            html += `<tr class="row-grupo"><td>(-) DEDUÇÕES E ABATIMENTOS (Simples Nacional / DAS)</td><td class="num" style="color:var(--danger);">${formatarMoeda(totalDeducoes)}</td></tr>`;
            for (let c in detalheDeducoes) {
                html += `<tr><td class="row-sub">• ${c}</td><td class="num">${formatarMoeda(detalheDeducoes[c])}</td></tr>`;
            }

            html += `<tr class="row-total"><td>(=) RECEITA LÍQUIDA</td><td class="num">${formatarMoeda(receitaLiquida)}</td></tr>`;

            html += `<tr class="row-grupo"><td>(-) CUSTOS DOS SERVIÇOS PRESTADOS OU PRODUTOS VENDIDOS (CPV)</td><td class="num" style="color:var(--danger);">${formatarMoeda(totalCPV)}</td></tr>`;
            for (let c in detalheCPV) {
                html += `<tr><td class="row-sub">• ${c}</td><td class="num">${formatarMoeda(detalheCPV[c])}</td></tr>`;
            }

            html += `<tr class="row-total"><td>(=) LUCRO BRUTO</td><td class="num">${formatarMoeda(lucroBruto)}</td></tr>`;

            html += `<tr class="row-grupo"><td>(-) DESPESAS OPERACIONAIS (Adm, P&amp;D, Aluguel, Salários)</td><td class="num" style="color:var(--danger);">${formatarMoeda(totalDespesas)}</td></tr>`;
            for (let c in detalheDespesas) {
                html += `<tr><td class="row-sub">• ${c}</td><td class="num">${formatarMoeda(detalheDespesas[c])}</td></tr>`;
            }

            html += `<tr class="row-total"><td>(=) RESULTADO OPERACIONAL</td><td class="num">${formatarMoeda(resultadoOperacional)}</td></tr>`;
            html += `<tr class="row-lucro"><td>(=) LUCRO LÍQUIDO DO EXERCÍCIO (LLE)</td><td class="num">${formatarMoeda(lucroLiquido)}</td></tr>`;

            document.getElementById('tbodyDRE').innerHTML = html;
        } catch (err) {
            document.getElementById('tbodyDRE').innerHTML = `<tr><td colspan="2" class="vazio">Erro ao carregar DRE: ${err.message}</td></tr>`;
        }
    }

    window.onload = carregarDRE;
</script>
</body>
</html>
