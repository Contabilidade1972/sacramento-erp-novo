<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativos e Equipamentos de P&D — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script src="erp-core.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 24px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 24px; }

        .page-toolbar { display: flex; justify-content: flex-start; align-items: center; margin-bottom: -10px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
        .btn-acao:hover { background: var(--primary-dark); }

        .page-title { font-size: 20px; font-weight: 800; color: var(--secondary); display: flex; align-items: center; gap: 10px; }
        .page-subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .panel-header { font-size: 15px; font-weight: 700; color: var(--secondary); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

        label { font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; display: block; text-transform: uppercase; }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; margin-bottom: 12px; background: var(--bg); color: var(--text-main); outline: none; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); background: #fff; }

        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-secondary { background: var(--bg); color: var(--text-main); border: 1.5px solid var(--border); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary:hover { background: var(--card); border-color: var(--primary); }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; display: inline-block; }
        .b-ativo { background: #dcfce7; color: #166534; }
        .b-manutencao { background: #fef3c7; color: #92400e; }
        .b-baixado { background: #fee2e2; color: #991b1b; }

        .analitica-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .analitica-table th { background: var(--bg); padding: 12px 14px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); }
        .analitica-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        .analitica-table tbody tr:hover { background: #f8fafc; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 4000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; }
        .toast.success { background: var(--success); } .toast.error { background: var(--danger); } .toast.info { background: var(--primary); }
        .empty-state { font-size: 13px; color: var(--text-light); padding: 20px; text-align: center; }

        footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-light); border-top: 1px solid var(--border); background: var(--card); margin-top: auto; }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-toolbar">
        <button class="btn-acao" onclick="location.href='modulo_tecnologia_pd.html'"><i class="fas fa-arrow-left"></i> Módulo Tecnologia & P&D</button>
    </div>

    <div>
        <div class="page-title"><i class="fas fa-microscope" style="color:var(--primary);"></i> Gestão de Ativos e Equipamentos de P&D</div>
        <div class="page-subtitle">Controle de instrumentos laboratoriais, maquinário, depreciação e alocação em projetos de inovação</div>
    </div>

    <div class="panel">
        <div class="panel-header" style="border:none; margin-bottom:4px;">
            <span id="tituloForm"><i class="fas fa-plus-circle" style="color:var(--success)"></i> Cadastrar novo ativo / equipamento</span>
        </div>
        <input type="hidden" id="edit_id">

        <div class="form-row">
            <div>
                <label>Projeto Vinculado *</label>
                <select id="projeto_id" class="form-control">
                    <option value="">— Selecione o projeto —</option>
                </select>
            </div>
            <div>
                <label>Nome do Equipamento / Ativo *</label>
                <input id="nome_ativo" class="form-control" placeholder="Ex.: Espectrofotômetro UV-Vis / Estação de Trabalho CAD">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Número de Patrimônio / Série</label>
                <input id="patrimonio" class="form-control" placeholder="Ex.: PAT-98234">
            </div>
            <div>
                <label>Valor de Aquisição (R$) *</label>
                <input id="valor_aquisicao" class="form-control" placeholder="Ex.: 45.000,00" onblur="formatarCampoMoeda(this)">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label>Data de Aquisição *</label>
                <input id="data_aquisicao" class="form-control" type="date">
            </div>
            <div>
                <label>Status Operacional *</label>
                <select id="status_ativo" class="form-control">
                    <option value="operacional">Operacional / Em Uso</option>
                    <option value="manutencao">Em Manutenção / Calibração</option>
                    <option value="baixado">Baixado / Alienado</option>
                </select>
            </div>
        </div>

        <div>
            <label>Especificações Técnicas / Laboratório de Alocação *</label>
            <input id="especificacoes" class="form-control" placeholder="Descreva especificações técnicas, modelo, fabricante e laboratório físico...">
        </div>

        <div style="display:flex; gap:10px; margin-top:4px;">
            <button class="btn-primary" id="btnSalvar" onclick="salvarAtivo()"><i class="fas fa-save"></i> Salvar ativo</button>
            <button class="btn-secondary" id="btnCancelar" onclick="cancelarEdicao()" style="display:none;"><i class="fas fa-times"></i> Cancelar edição</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span><i class="fas fa-list"></i> Ativos e Equipamentos Alocados</span>
        </div>
        <div id="listaAtivos" style="overflow-x:auto;">A carregar ativos...</div>
    </div>
</div>

<footer>
    Sacramento ERP — Sistema de Gestão Empresarial de Alta Performance © 2026
</footer>

<script>
var EMAIL_MASTER = "lucianojorgesacramento@gmail.com";
var TABELAS_SEM_CLIENTE = ['clientes_contratantes','usuarios','usuarios_empresa','cliente_modulos','configuracoes_sistema','logs'];

const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co','sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
let ativosCache = [];
let projetosCache = [];

var STATUS_MAP = {
    operacional: { rotulo: 'Operacional', classe: 'b-ativo' },
    manutencao:  { rotulo: 'Manutenção',  classe: 'b-manutencao' },
    baixado:     { rotulo: 'Baixado',     classe: 'b-baixado' }
};

function obterUsuarioAtual(){try{const s=localStorage.getItem('usuarioLogado');if(s)return JSON.parse(s);}catch(e){}return null;}
function clienteIdAtual(){try{const sel=localStorage.getItem('empresaSelecionada');if(sel)return parseInt(sel);}catch(e){}const u=obterUsuarioAtual();return (u&&u.cliente_id)?u.cliente_id:1;}

function sbFiltro(tabela){
    let q=sb.from(tabela).select('*');
    const cid=clienteIdAtual();
    if(!TABELAS_SEM_CLIENTE.includes(tabela)&&cid) q=q.eq('cliente_id',cid);
    return q;
}

function toast(msg,type='success'){
    var c=document.getElementById('toastContainer'),x=document.createElement('div');
    if(!c){
        c=document.createElement('div');c.id='toastContainer';
        c.style.cssText='position:fixed;top:20px;right:20px;z-index:4000;display:flex;flex-direction:column;gap:8px';
        document.body.appendChild(c);
    }
    x.className='toast '+type;
    x.innerHTML='<i class="fas fa-info-circle"></i> '+msg;
    c.appendChild(x);
    setTimeout(function(){x.remove();},3000);
}

function parseValorBR(v){
    if(v===null||v===undefined)return 0;
    var s=String(v).trim().replace(/[R$\s]/g,'');
    if(!s)return 0;
    if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.');}
    var n=parseFloat(s);
    return isNaN(n)?0:n;
}
function formatarCampoMoeda(el){
    if(el.value.trim()===''){el.value='';return;}
    var n=parseValorBR(el.value);
    el.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBR(n){return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function formatDataBR(d){if(!d)return '—';var p=String(d).split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return d;}

async function carregarProjetosSelect(){
    var r = await sbFiltro('projetos_pd');
    if(!r.error) {
        projetosCache = r.data || [];
        var sel = document.getElementById('projeto_id');
        sel.innerHTML = '<option value="">— Selecione o projeto —</option>';
        projetosCache.forEach(p => {
            sel.innerHTML += `<option value="${p.id}">${p.codigo ? p.codigo + ' · ' : ''}${p.nome}</option>`;
        });
    }
}

async function carregarAtivos(){
    var el=document.getElementById('listaAtivos');
    var cid=clienteIdAtual();
    if(!cid){el.innerHTML='<div class="empty-state">Cliente não identificado.</div>';return;}
    var r=await sbFiltro('ativos_equipamentos');
    if(r.error){el.innerHTML='<div class="empty-state">Tabela em configuração ou vazia.</div>';return;}
    ativosCache=r.data||[];
    if(!ativosCache.length){el.innerHTML='<div class="empty-state">Nenhum ativo ou equipamento registrado.</div>';return;}
    
    var html='<table class="analitica-table"><thead><tr><th>Equipamento / Ativo</th><th>Patrimônio</th><th>Projeto Alocado</th><th>Aquisição</th><th>Status</th><th style="text-align:right;">Valor (R$)</th><th style="text-align:right;">Ações</th></tr></thead><tbody>';
    ativosCache.forEach(function(a){
        var proj = null;
        for(var i=0; i<projetosCache.length; i++){ if(String(projetosCache[i].id) === String(a.projeto_id)) proj = projetosCache[i]; }
        var nomeProj = proj ? (proj.codigo ? proj.codigo + ' · ' : '') + proj.nome : '—';
        var st = STATUS_MAP[a.status_ativo] || STATUS_MAP.operacional;

        html+='<tr>'+
            '<td><strong>'+(a.nome_ativo||'—')+'</strong><br><small style="color:var(--text-light)">'+(a.especificacoes||'')+'</small></td>'+
            '<td>'+(a.patrimonio||'—')+'</td>'+
            '<td>'+nomeProj+'</td>'+
            '<td>'+formatDataBR(a.data_aquisicao)+'</td>'+
            '<td><span class="badge '+st.classe+'">'+st.rotulo+'</span></td>'+
            '<td style="text-align:right; font-weight:bold;">R$ '+fmtBR(a.valor_aquisicao)+'</td>'+
            '<td style="text-align:right; white-space:nowrap;">'+
                '<button class="btn-secondary" onclick="editarAtivo(\''+a.id+'\')" title="Editar"><i class="fas fa-pen"></i></button>'+
                '<button class="btn-secondary" onclick="excluirAtivo(\''+a.id+'\')" title="Excluir" style="color:var(--danger);"><i class="fas fa-trash"></i></button>'+
            '</td>'+
        '</tr>';
    });
    html+='</tbody></table>';
    el.innerHTML=html;
}

function editarAtivo(id){
    var a=null;
    for(var i=0;i<ativosCache.length;i++){if(String(ativosCache[i].id)===String(id))a=ativosCache[i];}
    if(!a)return;
    document.getElementById('edit_id').value=a.id;
    document.getElementById('projeto_id').value=a.projeto_id||'';
    document.getElementById('nome_ativo').value=a.nome_ativo||'';
    document.getElementById('patrimonio').value=a.patrimonio||'';
    document.getElementById('valor_aquisicao').value=a.valor_aquisicao?fmtBR(a.valor_aquisicao):'';
    document.getElementById('data_aquisicao').value=a.data_aquisicao||'';
    document.getElementById('status_ativo').value=a.status_ativo||'operacional';
    document.getElementById('especificacoes').value=a.especificacoes||'';

    document.getElementById('tituloForm').innerHTML='<i class="fas fa-edit" style="color:var(--primary)"></i> Editando ativo / equipamento';
    document.getElementById('btnSalvar').innerHTML='<i class="fas fa-sync-alt"></i> Atualizar ativo';
    document.getElementById('btnCancelar').style.display='inline-flex';
    window.scrollTo({top:0,behavior:'smooth'});
}

function cancelarEdicao(){
    document.getElementById('edit_id').value='';
    document.getElementById('projeto_id').value='';
    document.getElementById('nome_ativo').value='';
    document.getElementById('patrimonio').value='';
    document.getElementById('valor_aquisicao').value='';
    document.getElementById('data_aquisicao').value='';
    document.getElementById('status_ativo').value='operacional';
    document.getElementById('especificacoes').value='';

    document.getElementById('tituloForm').innerHTML='<i class="fas fa-plus-circle" style="color:var(--success)"></i> Cadastrar novo ativo / equipamento';
    document.getElementById('btnSalvar').innerHTML='<i class="fas fa-save"></i> Salvar ativo';
    document.getElementById('btnCancelar').style.display='none';
}

async function salvarAtivo(){
    var cid=clienteIdAtual();
    if(!cid){toast('Cliente não identificado.','error');return;}

    var projetoId=document.getElementById('projeto_id').value;
    if(!projetoId){toast('Selecione o projeto vinculado.','error');return;}

    var nome=document.getElementById('nome_ativo').value.trim();
    if(!nome){toast('Informe o nome do equipamento ou ativo.','error');return;}

    var valor=parseValorBR(document.getElementById('valor_aquisicao').value);
    if(!valor||valor<=0){toast('Informe o valor de aquisição.','error');return;}

    var data=document.getElementById('data_aquisicao').value;
    if(!data){toast('Informe a data de aquisição.','error');return;}

    var dados={
        cliente_id: cid,
        projeto_id: projetoId,
        nome_ativo: nome,
        patrimonio: document.getElementById('patrimonio').value.trim()||null,
        valor_aquisicao: valor,
        data_aquisicao: data,
        status_ativo: document.getElementById('status_ativo').value,
        especificacoes: document.getElementById('especificacoes').value.trim()||null
    };

    var editId=document.getElementById('edit_id').value;
    if(editId){
        var ru=await sb.from('ativos_equipamentos').update(dados).eq('id', editId);
        if(ru.error){toast('Erro ao atualizar: '+ru.error.message,'error');return;}
        toast('Ativo atualizado com sucesso!');
        cancelarEdicao();
    }else{
        var ri=await sb.from('ativos_equipamentos').insert([dados]);
        if(ri.error){
            toast('Erro ao salvar: ' + ri.error.message, 'error');
            return;
        }
        toast('Ativo cadastrado com sucesso!');
        cancelarEdicao();
    }
    carregarAtivos();
}

async function excluirAtivo(id){
    if(!confirm('Tem certeza que deseja excluir este registro de ativo?'))return;
    var r=await sb.from('ativos_equipamentos').delete().eq('id', id);
    if(r.error){toast('Erro ao excluir: '+r.error.message,'error');return;}
    toast('Ativo excluído com sucesso!');
    carregarAtivos();
}

async function inicializarPagina(){
    let u=obterUsuarioAtual();
    if(!u||!u.email){location.href='login.html';return;}
    await carregarProjetosSelect();
    await carregarAtivos();
}

window.onload=inicializarPagina;
</script>
</body>
</html>
