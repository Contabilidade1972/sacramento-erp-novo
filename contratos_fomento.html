<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos & Aportes — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script src="erp-core.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 24px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 24px; }

        .page-toolbar { display: flex; justify-content: flex-start; align-items: center; margin-bottom: -10px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
        .btn-acao:hover { background: var(--primary-dark); }

        .page-title { font-size: 20px; font-weight: 800; color: var(--secondary); display: flex; align-items: center; gap: 10px; }
        .page-subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .panel-header { font-size: 15px; font-weight: 700; color: var(--secondary); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }

        label { font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 4px; display: block; text-transform: uppercase; }
        .form-control { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; margin-bottom: 12px; background: var(--bg); color: var(--text-main); outline: none; }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); background: #fff; }

        .btn-primary { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-secondary { background: var(--bg); color: var(--text-main); border: 1.5px solid var(--border); padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary:hover { background: var(--card); border-color: var(--primary); }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        
        .analitica-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .analitica-table th { background: var(--bg); padding: 12px 14px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); }
        .analitica-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        .analitica-table tbody tr:hover { background: #f8fafc; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 4000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 16px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; }
        .toast.success { background: var(--success); } .toast.error { background: var(--danger); } .toast.info { background: var(--primary); }
        .empty-state { font-size: 13px; color: var(--text-light); padding: 20px; text-align: center; }

        footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-light); border-top: 1px solid var(--border); background: var(--card); margin-top: auto; }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-toolbar">
        <button class="btn-acao" onclick="location.href='modulo_tecnologia_pd.html'"><i class="fas fa-arrow-left"></i> Módulo Tecnologia & P&D</button>
    </div>

    <div>
        <div class="page-title"><i class="fas fa-file-signature" style="color:var(--primary);"></i> Contratos & Aportes (Fomento)</div>
        <div class="page-subtitle">Controle de instrumentos de fomento, convênios, editais e repasses financeiros para inovação</div>
    </div>

    <div class="panel">
        <div class="panel-header" style="border:none; margin-bottom:4px;">
            <span><i class="fas fa-plus-circle" style="color:var(--success)"></i> Novo Contrato ou Convênio de Fomento</span>
        </div>
        <input type="hidden" id="edit_id">
        <div class="form-row">
            <div>
                <label>Número do Contrato / Edital</label>
                <input type="text" id="numContrato" class="form-control" placeholder="Ex: FINEP 01/2026">
            </div>
            <div>
                <label>Projeto Vinculado</label>
                <select id="projetoId" class="form-control"><option value="">Carregando projetos...</option></select>
            </div>
            <div>
                <label>Financiador / Agência</label>
                <input type="text" id="financiador" class="form-control" placeholder="Ex: FINEP, CNPq, FAPEMIG">
            </div>
            <div>
                <label>Valor Total (R$)</label>
                <input type="number" id="valorTotal" class="form-control" step="0.01" min="0" placeholder="0,00">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Natureza Contábil</label>
                <select id="naturezaContabil" class="form-control">
                    <option value="subvencao_custeio" selected>Subvenção para Custeio</option>
                    <option value="aporte_reembolsavel">Aporte Reembolsável (Mutuável)</option>
                    <option value="subvencao_investimento">Subvenção para Investimento</option>
                    <option value="recurso_proprio">Recurso Próprio</option>
                </select>
            </div>
            <div>
                <label>Data de Assinatura</label>
                <input type="date" id="dataAssinatura" class="form-control">
            </div>
            <div>
                <label>Vigência (Fim)</label>
                <input type="date" id="dataVigencia" class="form-control">
            </div>
            <div>
                <label>Status</label>
                <select id="statusContrato" class="form-control">
                    <option value="Vigente" selected>Vigente</option>
                    <option value="Em Negociação">Em Negociação</option>
                    <option value="Encerrado">Encerrado</option>
                </select>
            </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:4px;">
            <button class="btn-primary" onclick="salvarContrato()"><i class="fas fa-save"></i> Salvar Contrato</button>
            <button class="btn-secondary" id="btnCancelar" onclick="cancelarEdicao()" style="display:none;"><i class="fas fa-times"></i> Cancelar</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span><i class="fas fa-list"></i> Contratos de Fomento Registrados</span>
        </div>
        <div id="listaContratos" style="overflow-x:auto;">Carregando contratos...</div>
    </div>
</div>

<footer>
    Sacramento ERP — Sistema de Gestão Empresarial de Alta Performance © 2026
</footer>

<script>
var EMAIL_MASTER = "lucianojorgesacramento@gmail.com";
var TABELAS_SEM_CLIENTE = ['clientes_contratantes','usuarios','usuarios_empresa','cliente_modulos','configuracoes_sistema','logs'];

const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co','sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
let contratosCache = [];
let projetosMap = {};

function obterUsuarioAtual(){try{const s=localStorage.getItem('usuarioLogado');if(s)return JSON.parse(s);}catch(e){}return null;}
function clienteIdAtual(){try{const sel=localStorage.getItem('empresaSelecionada');if(sel)return parseInt(sel);}catch(e){}const u=obterUsuarioAtual();return (u&&u.cliente_id)?u.cliente_id:1;}

function sbFiltro(tabela){
    let q=sb.from(tabela).select('*');
    const cid=clienteIdAtual();
    if(!TABELAS_SEM_CLIENTE.includes(tabela)&&cid) q=q.eq('cliente_id',cid);
    return q;
}

function toast(msg,type='success'){
    var c=document.getElementById('toastContainer'),x=document.createElement('div');
    if(!c){
        c=document.createElement('div');c.id='toastContainer';
        c.style.cssText='position:fixed;top:20px;right:20px;z-index:4000;display:flex;flex-direction:column;gap:8px';
        document.body.appendChild(c);
    }
    x.className='toast '+type;
    x.innerHTML='<i class="fas fa-info-circle"></i> '+msg;
    c.appendChild(x);
    setTimeout(function(){x.remove();},3000);
}

function formatBRL(valor){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(valor||0);}
function formatData(d){if(!d)return '-';return String(d).split('-').reverse().join('/');}

async function carregarProjetosSelect(){
    const sel = document.getElementById('projetoId');
    try {
        let q = sbFiltro('projetos_pd');
        const { data } = await q.order('nome');
        sel.innerHTML = '<option value="">— Selecione o Projeto —</option>';
        projetosMap = {};
        (data || []).forEach(p => {
            projetosMap[p.id] = p.nome || ('Projeto #' + p.id);
            sel.innerHTML += `<option value="${p.id}">${p.codigo ? p.codigo + ' - ' : ''}${p.nome}</option>`;
        });
    } catch(e) {}
}

async function carregarContratos(){
    const el = document.getElementById('listaContratos');
    try {
        let q = sbFiltro('contratos_fomento');
        const { data, error } = await q.order('id', { ascending: false });
        if(error) { el.innerHTML = '<div class="empty-state">Erro: '+error.message+'</div>'; return; }
        contratosCache = data || [];
        if(!contratosCache.length) { el.innerHTML = '<div class="empty-state">Nenhum contrato de fomento cadastrado.</div>'; return; }
        
        let html = '<table class="analitica-table"><thead><tr><th>Contrato / Edital</th><th>Projeto</th><th>Financiador</th><th>Natureza</th><th style="text-align:right;">Valor Total (R$)</th><th>Vigência</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead><tbody>';
        contratosCache.forEach(c => {
            const nomeProj = projetosMap[c.projeto_id] || '—';
            const natRotulo = c.natureza_contabil === 'aporte_reembolsavel' ? 'Aporte Reembolsável' : (c.natureza_contabil === 'subvencao_investimento' ? 'Subv. Investimento' : (c.natureza_contabil === 'recurso_proprio' ? 'Recurso Próprio' : 'Subv. Custeio'));
            html += `<tr>
                <td><strong>${c.numero_contrato || '-'}</strong></td>
                <td>${nomeProj}</td>
                <td>${c.financiador || '-'}</td>
                <td><span style="font-size:11px; font-weight:600; color:var(--text-light);">${natRotulo}</span></td>
                <td style="text-align:right; font-weight:bold;">${formatBRL(c.valor_total)}</td>
                <td>${formatData(c.data_vigencia)}</td>
                <td><span style="padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; background:#dcfce7; color:#166534;">${c.status || 'Vigente'}</span></td>
                <td style="text-align:right; white-space:nowrap;">
                    <button class="btn-secondary" onclick="editarContrato(${c.id})" title="Editar"><i class="fas fa-pen"></i></button>
                    <button class="btn-secondary" onclick="excluirContrato(${c.id})" title="Excluir" style="color:var(--danger);"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        el.innerHTML = html;
    } catch(e) {
        el.innerHTML = '<div class="empty-state">Erro ao carregar contratos.</div>';
    }
}

async function salvarContrato(){
    const id = document.getElementById('edit_id').value;
    const num = document.getElementById('numContrato').value.trim();
    const projId = document.getElementById('projetoId').value;
    const financiador = document.getElementById('financiador').value.trim();
    const valor = parseFloat(document.getElementById('valorTotal').value) || 0;
    const natureza = document.getElementById('naturezaContabil').value;
    const assinatura = document.getElementById('dataAssinatura').value;
    const vigencia = document.getElementById('dataVigencia').value;
    const status = document.getElementById('statusContrato').value;

    if(!num) { toast("Informe o número do contrato ou edital.", "error"); return; }
    if(!projId) { toast("Selecione o projeto vinculado.", "error"); return; }
    if(valor <= 0) { toast("Informe um valor total válido.", "error"); return; }

    const cid = clienteIdAtual();
    const payload = {
        cliente_id: cid,
        numero_contrato: num,
        projeto_id: parseInt(projId),
        financiador: financiador || null,
        valor_total: valor,
        natureza_contabil: natureza,
        data_assinatura: assinatura || null,
        data_vigencia: vigencia || null,
        status: status
    };

    let res;
    if(id) {
        res = await sb.from('contratos_fomento').update(payload).eq('id', id);
    } else {
        res = await sb.from('contratos_fomento').insert([payload]);
    }

    if(res.error) { toast("Erro ao salvar contrato: " + res.error.message, "error"); return; }
    toast("Contrato salvo com sucesso!");
    cancelarEdicao();
    carregarContratos();
}

function editarContrato(id){
    const c = contratosCache.find(x => x.id === id);
    if(!c) return;
    document.getElementById('edit_id').value = c.id;
    document.getElementById('numContrato').value = c.numero_contrato || '';
    document.getElementById('projetoId').value = c.projeto_id || '';
    document.getElementById('financiador').value = c.financiador || '';
    document.getElementById('valorTotal').value = c.valor_total || '';
    document.getElementById('naturezaContabil').value = c.natureza_contabil || 'subvencao_custeio';
    document.getElementById('dataAssinatura').value = c.data_assinatura || '';
    document.getElementById('dataVigencia').value = c.data_vigencia || '';
    document.getElementById('statusContrato').value = c.status || 'Vigente';
    document.getElementById('btnCancelar').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelarEdicao(){
    document.getElementById('edit_id').value = '';
    document.getElementById('numContrato').value = '';
    document.getElementById('projetoId').value = '';
    document.getElementById('financiador').value = '';
    document.getElementById('valorTotal').value = '';
    document.getElementById('naturezaContabil').value = 'subvencao_custeio';
    document.getElementById('dataAssinatura').value = '';
    document.getElementById('dataVigencia').value = '';
    document.getElementById('statusContrato').value = 'Vigente';
    document.getElementById('btnCancelar').style.display = 'none';
}

async function excluirContrato(id){
    if(!confirm("Deseja realmente excluir este contrato de fomento?")) return;
    const { error } = await sb.from('contratos_fomento').delete().eq('id', id);
    if(error) { toast("Erro ao excluir: " + error.message, "error"); return; }
    toast("Contrato excluído com sucesso!");
    carregarContratos();
}

async function inicializarPagina(){
    let u = obterUsuarioAtual();
    if(!u || !u.email) { location.href = 'login.html'; return; }
    await carregarProjetosSelect();
    await carregarContratos();
}

window.onload = inicializarPagina;
</script>
</body>
</html>
