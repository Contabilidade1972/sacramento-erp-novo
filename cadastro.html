<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empresa / Licenciamento — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="erp-core.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px; }

        .registo-wrapper {
            background: var(--card); width: 100%; max-width: 650px; border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 24px;
            margin-top: 40px;
        }

        .registo-header h1 { font-size: 22px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; }
        .registo-header p { font-size: 13px; color: var(--text-light); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; grid-column: span 1; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-light); }
        .form-group input, .form-group select {
            height: 42px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: #f8fafc; color: var(--text-main); outline: none;
        }
        .form-group input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .cnpj-box { display: flex; gap: 10px; }
        .cnpj-box input { flex: 1; }
        .btn-consulta { background: var(--secondary); color: #fff; border: none; padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-consulta:hover { background: #111827; }

        .btn-salvar {
            background: var(--success); color: #fff; border: none; height: 46px; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(16,185,129,0.2);
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .btn-salvar:hover { background: #059669; }

        .logo-preview-box { display: flex; align-items: center; gap: 14px; background: #f1f5f9; padding: 12px; border-radius: 10px; border: 1px dashed var(--border); }
        .logo-preview-box img { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="registo-wrapper">
    <div class="registo-header">
        <h1>Ativação de Licença & Empresa</h1>
        <p>Digite o CNPJ para preenchimento automático via Receita Federal e configure a identidade visual.</p>
    </div>

    <form id="formRegisto" onsubmit="salvarEmpresa(event)" style="display: flex; flex-direction: column; gap: 16px;">
        
        <div class="form-group full">
            <label>CNPJ da Empresa</label>
            <div class="cnpj-box">
                <input type="text" id="cnpj" required placeholder="00.000.000/0001-00" onblur="consultarCnpjReceita()">
                <button type="button" class="btn-consulta" onclick="consultarCnpjReceita()"><i class="fas fa-search"></i> Consultar Receita</button>
            </div>
        </div>

        <div class="form-group full">
            <label>Razão Social</label>
            <input type="text" id="razao_social" required placeholder="Razão social oficial obtida...">
        </div>

        <div class="form-group">
            <label>Nome Fantasia</label>
            <input type="text" id="nome_fantasia" placeholder="Nome comercial...">
        </div>

        <div class="form-group">
            <label>Tipo de Licenciamento</label>
            <select id="licenca">
                <option value="mensal">Mensal</option>
                <option value="semestral">Semestral</option>
                <option value="anual">Anual</option>
                <option value="vitalicio">Vitalício (Master)</option>
            </select>
        </div>

        <div class="form-group full">
            <label>Logotipo Corporativo (URL ou Arquivo)</label>
            <div class="logo-preview-box">
                <img id="imgLogoPreview" src="https://via.placeholder.com/48" alt="Logo">
                <input type="text" id="logo_url" placeholder="Cole o link da imagem do logotipo aqui..." style="flex:1;" oninput="atualizarLogoPreview()">
            </div>
        </div>

        <button type="submit" class="btn-salvar"><i class="fas fa-check-circle"></i> Concluir Registro e Ativar Empresa</button>
    </form>
</div>

<script>
    const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co', 'sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');

    async function consultarCnpjReceita() {
        let cnpjVal = document.getElementById('cnpj').value.replace(/\D/g, '');
        if (cnpjVal.length !== 14) {
            alert('Por favor, digite um CNPJ válido com 14 dígitos.');
            return;
        }

        try {
            const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjVal}`);
            if (!response.ok) throw new Error('CNPJ não encontrado na base federal.');
            const data = await response.json();

            document.getElementById('razao_social').value = data.razao_social || '';
            document.getElementById('nome_fantasia').value = data.nome_fantasia || data.razao_social || '';
            alert('Dados fiscais obtidos com sucesso da Receita Federal!');
        } catch (err) {
            alert('Aviso: Não foi possível preencher automaticamente (' + err.message + '). Preencha manualmente.');
        }
    }

    function atualizarLogoPreview() {
        const url = document.getElementById('logo_url').value.trim();
        if (url) document.getElementById('imgLogoPreview').src = url;
    }

    async function salvarEmpresa(event) {
        event.preventDefault();
        const razao = document.getElementById('razao_social').value;
        const fantasia = document.getElementById('nome_fantasia').value;
        const cnpj = document.getElementById('cnpj').value;
        const licenca = document.getElementById('licenca').value;
        const logo = document.getElementById('logo_url').value;

        try {
            const { error } = await sb.from('clientes_contratantes').insert([{
                razao_social: razao,
                nome_fantasia: fantasia,
                cnpj: cnpj,
                tipo_licenca: licenca,
                logo_url: logo
            }]);

            if (error) throw error;

            alert('Empresa cadastrada e licenciada com sucesso!');
            window.location.href = 'index.html';
        } catch(err) {
            alert('Erro ao gravar no Supabase: ' + err.message);
        }
    }
</script>
</body>
</html>
