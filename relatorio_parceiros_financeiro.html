<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição Financeira por Parceiro (Fornecedores & Clientes) — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <script src="erp-core.js"></script>
    <script src="erp-print.js"></script>
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #1e3a8a;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
            --bg: #f8fafc; --card: #ffffff; --text-main: #0f172a; --text-light: #64748b; --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 24px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 22px; }
        .page-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background 0.2s; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
        .btn-acao:hover { background: var(--primary-dark); }
        .btn-acao.sucesso { background: var(--success); box-shadow: 0 2px 6px rgba(16,185,129,0.2); }
        .btn-acao.sucesso:hover { background: #059669; }
        .btn-acao.cinza { background: #64748b; box-shadow: none; }

        .page-title { font-size: 22px; font-weight: 800; color: var(--secondary); display: flex; align-items: center; gap: 10px; }
        .page-subtitle { font-size: 13px; color: var(--text-light); margin-top: 4px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 6px; border-top: 4px solid var(--secondary); }
        .kpi-card.vermelho { border-top-color: var(--danger); } .kpi-card.azul { border-top-color: var(--primary); } .kpi-card.amarelo { border-top-color: var(--warning); }
        .kpi-title { font-size: 10.5px; font-weight: 800; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.6px; }
        .kpi-value { font-size: 22px; font-weight: 800; color: var(--secondary); letter-spacing: -0.5px; }
        .kpi-sub { font-size: 11px; color: var(--text-light); }

        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .panel-title { font-size: 15px; font-weight: 800; color: var(--secondary); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .panel-title .t { display: flex; align-items: center; gap: 8px; }

        .filtros-box { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; align-items: flex-end; background: var(--bg); padding: 18px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; }
        label { font-size: 11px; font-weight: 700; color: var(--text-light); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: .4px; }
        .form-control { width: 100%; height: 42px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; background: #fff; color: var(--text-main); outline: none; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .acoes-filtro { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .abas { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
        .abas button { border: none; background: transparent; padding: 8px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--text-light); cursor: pointer; font-family: inherit; }
        .abas button.ativo { background: #fff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
        .analitica-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .analitica-table th { background: var(--bg); padding: 12px 14px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); white-space: nowrap; }
        .analitica-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        .analitica-table tbody tr:hover { background: #f8fafc; }
        .analitica-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .analitica-table tfoot td { background: var(--bg); font-weight: 800; border-top: 2px solid var(--border); border-bottom: none; }
        .neg { color: #991b1b; font-weight: 700; } .pos { color: #166534; font-weight: 700; }
        .sub { display: block; font-size: 11px; color: var(--text-light); margin-top: 2px; }
        .badge-st { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 10px; text-transform: uppercase; display: inline-block; letter-spacing: .3px; }
        .badge-atrasado { background: #fee2e2; color: #b91c1c; } .badge-aberto { background: #dbeafe; color: #1e40af; } .badge-hoje { background: #fef3c7; color: #92400e; }

        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 4000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 16px; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .toast.success { background: var(--success); } .toast.error { background: var(--danger); } .toast.info { background: var(--primary); }

        @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .filtros-box { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .kpi-grid, .filtros-box { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="page-toolbar">
        <a href="modulo_financeiro.html" class="btn-acao"><i class="fas fa-arrow-left"></i> Voltar ao Módulo Financeiro</a>
        <button class="btn-acao sucesso" type="button" onclick="executarImpressao()"><i class="fas fa-print"></i> Imprimir Posição</button>
    </div>

    <div>
        <div class="page-title"><i class="fas fa-handshake" style="color:var(--primary);"></i> Posição Financeira por Parceiro</div>
        <div class="page-subtitle" id="subtituloPagina">Títulos em aberto por fornecedor ou cliente, com vencidos, a vencer e dias de atraso</div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card azul"><div class="kpi-title">Total em aberto</div><div class="kpi-value" id="kpiTotal">R$ 0,00</div><div class="kpi-sub" id="kpiTotalSub"></div></div>
        <div class="kpi-card vermelho"><div class="kpi-title">Vencido (atrasado)</div><div class="kpi-value" style="color:#b91c1c;" id="kpiVencido">R$ 0,00</div><div class="kpi-sub" id="kpiVencidoSub"></div></div>
        <div class="kpi-card"><div class="kpi-title">A vencer</div><div class="kpi-value" id="kpiAVencer">R$ 0,00</div><div class="kpi-sub" id="kpiAVencerSub"></div></div>
        <div class="kpi-card amarelo"><div class="kpi-title">Parceiros com saldo</div><div class="kpi-value" style="color:#92400e;" id="kpiParceiros">0</div><div class="kpi-sub" id="kpiMaiorSub"></div></div>
    </div>

    <div class="panel">
        <div class="panel-title"><span class="t"><i class="fas fa-filter" style="color:var(--primary);"></i> Filtros</span></div>
        <div class="filtros-box">
            <div>
                <label>Posição de</label>
                <select id="filtroTipo" class="form-control" onchange="aoMudarTipo()">
                    <option value="pagar">Contas a Pagar (fornecedores)</option>
                    <option value="receber">Contas a Receber (clientes)</option>
                </select>
            </div>
            <div>
                <label>Situação</label>
                <select id="filtroStatus" class="form-control" onchange="aplicarFiltros()">
                    <option value="todos">Todos em aberto</option>
                    <option value="atrasado">Apenas vencidos</option>
                    <option value="avencer">Apenas a vencer</option>
                </select>
            </div>
            <div><label>Vencimento — de</label><input type="date" id="filtroDataInicio" class="form-control" onchange="aplicarFiltros()"></div>
            <div><label>Vencimento — até</label><input type="date" id="filtroDataFim" class="form-control" onchange="aplicarFiltros()"></div>
            <div>
                <label>Centro de custo</label>
                <select id="filtroCentroCusto" class="form-control" onchange="aplicarFiltros()"><option value="todos">Todos os centros de custo</option></select>
            </div>
            <div>
                <label id="labelParceiro">Fornecedor</label>
                <select id="filtroParceiro" class="form-control" onchange="aplicarFiltros()"><option value="todos">Todos</option></select>
            </div>
        </div>
        <div class="acoes-filtro">
            <div class="abas">
                <button type="button" id="abaSintetico" class="ativo" onclick="trocarVisao('sintetico')">Resumo por parceiro</button>
                <button type="button" id="abaAnalitico" onclick="trocarVisao('analitico')">Títulos (analítico)</button>
            </div>
            <button class="btn-acao cinza" type="button" onclick="limparFiltros()"><i class="fas fa-eraser"></i> Limpar filtros</button>
        </div>
        <div class="table-wrap" id="listaPosicao"><div style="padding:30px; text-align:center; color:var(--text-light);">Carregando...</div></div>
    </div>
</div>

<script>
    const sb = window.sb || supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co', 'sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
    const EMAIL_MASTER = "lucianojorgesacramento@gmail.com";

    let titulosAbertos = { pagar: null, receber: null };   // cache por tipo
    let lista = [];          // títulos filtrados
    let grupos = [];         // resumo por parceiro
    let visao = 'sintetico';
    let totais = null;

    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }
    function numero(v) {
        if (typeof v === 'number') return v;
        let s = String(v === null || v === undefined ? '' : v).trim();
        if (!s) return 0;
        if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
    }
    function arred(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
    function fmtBR(n) { return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function brl(n) { return 'R$ ' + fmtBR(n); }
    function dataISO(d) {
        if (!d) return '';
        const s = String(d).trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
        const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
        return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
    }
    function dataBR(iso) { return iso ? iso.split('-').reverse().join('/') : '—'; }
    function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function diasAtraso(venc, hoje) { return Math.round((new Date(hoje + 'T12:00:00') - new Date(venc + 'T12:00:00')) / 86400000); }

    function obterClienteIdAtivo() {
        try {
            const u = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
            const isMaster = (u.email || '').toLowerCase().trim() === EMAIL_MASTER || (u.perfil || '').toLowerCase().includes('master');
            if (isMaster) { const sel = localStorage.getItem('empresaSelecionada'); if (sel) return parseInt(sel); }
            return u.cliente_id ? parseInt(u.cliente_id) : 1;
        } catch (e) { return 1; }
    }
    function toast(msg, type) {
        type = type || 'success';
        let c = document.getElementById('toastContainer');
        if (!c) { c = document.createElement('div'); c.id = 'toastContainer'; c.className = 'toast-container'; document.body.appendChild(c); }
        const x = document.createElement('div'); x.className = 'toast ' + type; x.textContent = msg; c.appendChild(x);
        setTimeout(function () { x.remove(); }, type === 'error' ? 6000 : 3500);
    }

    async function lerTudo(tabela, cid) {
        const out = [], PAG = 1000;
        for (let ini = 0; ini < 200000; ini += PAG) {
            const r = await sb.from(tabela).select('*').eq('cliente_id', cid).order('id', { ascending: true }).range(ini, ini + PAG - 1);
            if (r.error) throw r.error;
            out.push.apply(out, r.data || []);
            if (!r.data || r.data.length < PAG) break;
        }
        return out;
    }

    // título "em aberto": não pago/recebido/quitado e não cancelado
    function emAberto(status) {
        const st = norm(status);
        return !(st.indexOf('pago') >= 0 || st.indexOf('recebido') >= 0 || st.indexOf('quitado') >= 0 || st.indexOf('cancel') >= 0);
    }

    async function carregarTipo(tipo) {
        if (titulosAbertos[tipo]) return titulosAbertos[tipo];
        const cid = obterClienteIdAtivo();
        const dados = await lerTudo(tipo === 'pagar' ? 'contas_pagar' : 'contas_receber', cid);
        const out = [];
        dados.forEach(function (t) {
            if (!emAberto(t.status)) return;
            const venc = dataISO(t.vencimento || t.data_vencimento);
            out.push({
                id: t.id, parceiro: tipo === 'pagar' ? (t.fornecedor_nome || t.fornecedor || 'Sem fornecedor informado') : (t.cliente_nome || t.cliente || 'Sem cliente informado'),
                descricao: t.descricao || 'Título financeiro', centro: t.centro_custo || '', venc: venc, valor: numero(t.valor), status: t.status || 'Pendente'
            });
        });
        titulosAbertos[tipo] = out;
        return out;
    }

    function trocarVisao(v) {
        visao = v;
        document.getElementById('abaSintetico').className = v === 'sintetico' ? 'ativo' : '';
        document.getElementById('abaAnalitico').className = v === 'analitico' ? 'ativo' : '';
        desenharTabela();
    }

    async function aoMudarTipo() {
        document.getElementById('filtroParceiro').value = 'todos';
        document.getElementById('filtroCentroCusto').value = 'todos';
        await carregarEPreencher();
    }

    async function carregarEPreencher() {
        const el = document.getElementById('listaPosicao');
        el.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-light);">Consultando base de dados...</div>';
        const tipo = document.getElementById('filtroTipo').value;
        document.getElementById('labelParceiro').textContent = tipo === 'receber' ? 'Cliente' : 'Fornecedor';
        try {
            const dados = await carregarTipo(tipo);
            const pSel = document.getElementById('filtroParceiro'), cSel = document.getElementById('filtroCentroCusto');
            const pAtual = pSel.value, cAtual = cSel.value;
            const nomes = {}, centros = {};
            dados.forEach(function (t) { nomes[t.parceiro] = true; if (t.centro) centros[t.centro] = true; });
            pSel.innerHTML = '<option value="todos">Todos</option>';
            Object.keys(nomes).sort().forEach(function (n) { const o = document.createElement('option'); o.value = n; o.textContent = n; pSel.appendChild(o); });
            cSel.innerHTML = '<option value="todos">Todos os centros de custo</option>';
            Object.keys(centros).sort().forEach(function (n) { const o = document.createElement('option'); o.value = n; o.textContent = n; cSel.appendChild(o); });
            pSel.value = nomes[pAtual] ? pAtual : 'todos';
            cSel.value = centros[cAtual] ? cAtual : 'todos';
            aplicarFiltros();
        } catch (e) {
            console.error(e);
            el.innerHTML = '<div style="padding:30px; text-align:center; color:var(--danger); font-weight:600;">Erro ao carregar: ' + esc(e.message || e) + '</div>';
            toast('Erro ao carregar a posição financeira.', 'error');
        }
    }

    function aplicarFiltros() {
        const tipo = document.getElementById('filtroTipo').value;
        const st = document.getElementById('filtroStatus').value;
        const ini = document.getElementById('filtroDataInicio').value, fim = document.getElementById('filtroDataFim').value;
        const cc = document.getElementById('filtroCentroCusto').value, par = document.getElementById('filtroParceiro').value;
        const hoje = hojeISO();
        const base = titulosAbertos[tipo] || [];

        lista = base.filter(function (t) {
            const atrasado = !!t.venc && t.venc < hoje;
            if (st === 'atrasado' && !atrasado) return false;
            if (st === 'avencer' && atrasado) return false;
            if (ini && (!t.venc || t.venc < ini)) return false;
            if (fim && (!t.venc || t.venc > fim)) return false;
            if (cc !== 'todos' && t.centro !== cc) return false;
            if (par !== 'todos' && t.parceiro !== par) return false;
            return true;
        }).map(function (t) {
            const atrasado = !!t.venc && t.venc < hoje;
            return Object.assign({}, t, { atrasado: atrasado, dias: atrasado ? diasAtraso(t.venc, hoje) : 0, hoje: t.venc === hoje });
        });
        lista.sort(function (a, b) { return a.venc < b.venc ? -1 : (a.venc > b.venc ? 1 : 0); });

        const g = {};
        let tot = 0, venc = 0, aven = 0, nV = 0, nA = 0;
        lista.forEach(function (t) {
            tot += t.valor;
            if (t.atrasado) { venc += t.valor; nV++; } else { aven += t.valor; nA++; }
            const x = g[t.parceiro] = g[t.parceiro] || { parceiro: t.parceiro, qtd: 0, vencido: 0, avencer: 0, total: 0, maxDias: 0, proximo: '' };
            x.qtd++; x.total += t.valor;
            if (t.atrasado) { x.vencido += t.valor; if (t.dias > x.maxDias) x.maxDias = t.dias; } else { x.avencer += t.valor; if (!x.proximo || t.venc < x.proximo) x.proximo = t.venc; }
        });
        grupos = Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.total - a.total; });
        totais = { total: arred(tot), vencido: arred(venc), avencer: arred(aven), nV: nV, nA: nA, n: lista.length };

        document.getElementById('kpiTotal').textContent = brl(totais.total);
        document.getElementById('kpiTotalSub').textContent = totais.n + ' título(s) em aberto';
        document.getElementById('kpiVencido').textContent = brl(totais.vencido);
        document.getElementById('kpiVencidoSub').textContent = nV + ' título(s) vencido(s)';
        document.getElementById('kpiAVencer').textContent = brl(totais.avencer);
        document.getElementById('kpiAVencerSub').textContent = nA + ' título(s) a vencer';
        document.getElementById('kpiParceiros').textContent = grupos.length;
        document.getElementById('kpiMaiorSub').textContent = grupos.length ? 'Maior saldo: ' + grupos[0].parceiro + ' (' + brl(grupos[0].total) + ')' : '';
        desenharTabela();
    }

    function badge(t) {
        if (t.atrasado) return '<span class="badge-st badge-atrasado">Vencido há ' + t.dias + ' dia(s)</span>';
        if (t.hoje) return '<span class="badge-st badge-hoje">Vence hoje</span>';
        return '<span class="badge-st badge-aberto">A vencer</span>';
    }

    function desenharTabela() {
        const el = document.getElementById('listaPosicao');
        if (!lista.length) {
            el.innerHTML = '<div style="padding:30px; text-align:center; color:var(--text-light);">Nenhum título em aberto para os filtros selecionados.</div>';
            return;
        }
        let h;
        if (visao === 'sintetico') {
            h = '<table class="analitica-table"><thead><tr><th>' + (document.getElementById('filtroTipo').value === 'receber' ? 'Cliente' : 'Fornecedor') + '</th><th class="num">Títulos</th><th class="num">A vencer (R$)</th><th class="num">Vencido (R$)</th><th class="num">Total em aberto (R$)</th><th>Maior atraso</th><th>Próximo vencimento</th></tr></thead><tbody>';
            grupos.forEach(function (g) {
                h += '<tr><td><strong>' + esc(g.parceiro) + '</strong></td><td class="num">' + g.qtd + '</td><td class="num">' + fmtBR(g.avencer) + '</td>' +
                    '<td class="num ' + (g.vencido > 0 ? 'neg' : '') + '">' + fmtBR(g.vencido) + '</td><td class="num"><strong>' + fmtBR(g.total) + '</strong></td>' +
                    '<td>' + (g.maxDias > 0 ? g.maxDias + ' dia(s)' : '—') + '</td><td>' + (g.proximo ? dataBR(g.proximo) : '—') + '</td></tr>';
            });
            h += '</tbody><tfoot><tr><td>TOTAL</td><td class="num">' + totais.n + '</td><td class="num">' + fmtBR(totais.avencer) + '</td><td class="num">' + fmtBR(totais.vencido) + '</td><td class="num">' + fmtBR(totais.total) + '</td><td colspan="2"></td></tr></tfoot></table>';
        } else {
            h = '<table class="analitica-table"><thead><tr><th>' + (document.getElementById('filtroTipo').value === 'receber' ? 'Cliente / pagador' : 'Fornecedor / favorecido') + '</th><th>Descrição do título</th><th>Centro de custo</th><th>Vencimento</th><th>Situação</th><th class="num">Valor em aberto (R$)</th></tr></thead><tbody>';
            lista.forEach(function (t) {
                h += '<tr><td><strong>' + esc(t.parceiro) + '</strong></td><td>' + esc(t.descricao) + '</td><td>' + esc(t.centro || '—') + '</td><td style="white-space:nowrap;">' + dataBR(t.venc) + '</td><td>' + badge(t) + '</td><td class="num"><strong>' + fmtBR(t.valor) + '</strong></td></tr>';
            });
            h += '</tbody><tfoot><tr><td colspan="5">TOTAL EM ABERTO — vencido ' + brl(totais.vencido) + ' · a vencer ' + brl(totais.avencer) + '</td><td class="num">' + fmtBR(totais.total) + '</td></tr></tfoot></table>';
        }
        el.innerHTML = h;
    }

    function limparFiltros() {
        document.getElementById('filtroStatus').value = 'todos';
        document.getElementById('filtroDataInicio').value = '';
        document.getElementById('filtroDataFim').value = '';
        document.getElementById('filtroCentroCusto').value = 'todos';
        document.getElementById('filtroParceiro').value = 'todos';
        aplicarFiltros();
    }

    /* ---------- impressão padronizada ---------- */
    function executarImpressao() {
        if (!lista.length) { toast('Não há títulos em aberto para imprimir com os filtros atuais.', 'error'); return; }
        const tipo = document.getElementById('filtroTipo').value;
        const st = document.getElementById('filtroStatus').value;
        const ini = document.getElementById('filtroDataInicio').value, fim = document.getElementById('filtroDataFim').value;
        const cc = document.getElementById('filtroCentroCusto').value, par = document.getElementById('filtroParceiro').value;
        const rotulo = tipo === 'receber' ? 'Cliente' : 'Fornecedor';
        const filtros = [['Posição', tipo === 'receber' ? 'Contas a Receber (clientes)' : 'Contas a Pagar (fornecedores)'],
            ['Situação', st === 'atrasado' ? 'Apenas vencidos' : (st === 'avencer' ? 'Apenas a vencer' : 'Todos em aberto')],
            ['Vencimento', (ini || fim) ? ((ini ? dataBR(ini) : 'início') + ' a ' + (fim ? dataBR(fim) : 'sem limite')) : 'Todos os períodos'],
            ['Centro de custo', cc === 'todos' ? 'Todos' : cc], [rotulo, par === 'todos' ? 'Todos' : par]];
        const resumo = [['Total em aberto', brl(totais.total)], ['Vencido', brl(totais.vencido)], ['A vencer', brl(totais.avencer)], ['Títulos', String(totais.n)], ['Parceiros', String(grupos.length)]];
        let cfg;
        if (visao === 'sintetico') {
            cfg = {
                titulo: 'Posição Financeira por ' + rotulo, subtitulo: 'Resumo dos títulos em aberto por parceiro', codigo: 'FIN-PF', orientacao: 'landscape',
                colunas: [{ t: rotulo, w: 4 }, { t: 'Títulos', w: 0.8, a: 'right' }, { t: 'A vencer (R$)', w: 1.5, a: 'right' }, { t: 'Vencido (R$)', w: 1.5, a: 'right' }, { t: 'Total em aberto (R$)', w: 1.7, a: 'right' }, { t: 'Maior atraso', w: 1.2 }, { t: 'Próx. vencimento', w: 1.4 }],
                linhas: grupos.map(function (g) { return [g.parceiro, String(g.qtd), fmtBR(g.avencer), { t: fmtBR(g.vencido), cls: g.vencido > 0 ? 'neg' : '' }, { t: fmtBR(g.total), cls: 'bold' }, g.maxDias > 0 ? g.maxDias + ' dia(s)' : '—', g.proximo ? dataBR(g.proximo) : '—']; }),
                totais: ['TOTAL', String(totais.n), fmtBR(totais.avencer), fmtBR(totais.vencido), fmtBR(totais.total), '', '']
            };
        } else {
            cfg = {
                titulo: 'Posição Analítica por ' + rotulo, subtitulo: 'Títulos em aberto', codigo: 'FIN-PA', orientacao: 'landscape',
                colunas: [{ t: rotulo, w: 2.6 }, { t: 'Descrição do título', w: 3.2 }, { t: 'Centro de custo', w: 1.8 }, { t: 'Vencimento', w: 1.1 }, { t: 'Situação', w: 1.6 }, { t: 'Valor em aberto (R$)', w: 1.6, a: 'right' }],
                linhas: lista.map(function (t) { return [t.parceiro, t.descricao, t.centro || '—', dataBR(t.venc), { t: t.atrasado ? 'Vencido há ' + t.dias + ' dia(s)' : (t.hoje ? 'Vence hoje' : 'A vencer'), cls: t.atrasado ? 'neg' : '' }, { t: fmtBR(t.valor), cls: 'bold' }]; }),
                totais: ['TOTAL EM ABERTO', '', '', '', '', fmtBR(totais.total)]
            };
        }
        cfg.filtros = filtros; cfg.resumo = resumo;
        cfg.observacao = 'Considera apenas títulos em aberto (pagos, recebidos, quitados e cancelados não entram). "Vencido" = vencimento anterior à data de emissão deste relatório.';
        ERPPrint.imprimir(cfg);
    }

    async function inicializarPagina() {
        try {
            const u = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
            if (u && u.email && u.email.toLowerCase().trim() === EMAIL_MASTER) document.body.classList.add('usuario-master');
        } catch (e) {}
        await carregarEPreencher();
    }
    window.onload = inicializarPagina;
</script>
