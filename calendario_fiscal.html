<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Fiscal — Sacramento ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #1e3a8a;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --zebra: #fafbfc;
            --hover: #f1f5f9;
        }
        body.escuro {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #e2e8f0;
            --text-light: #94a3b8;
            --border: #334155;
            --zebra: #1a2740;
            --hover: #24344f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: row; transition: background 0.3s, color 0.3s; }

        .main { margin-left: 0; flex: 1; display: flex; flex-direction: column; min-width: 0; width: 100%; }
        .header { height: 60px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 900; }
        .header-title-wrapper { display: flex; align-items: center; gap: 12px; }
        .btn-home { background: linear-gradient(135deg,#2563eb,#1d4ed8); border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .header-title { font-size: 16px; font-weight: 700; color: var(--secondary); }
        .header-right { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--text-light); font-weight: 500; }
        .date-time { color: var(--primary); font-weight: 600; }
        .empresa-selector { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
        .empresa-selector i { color: var(--primary); font-size: 13px; }
        .empresa-selector select { border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--secondary); cursor: pointer; outline: none; max-width: 200px; }
        .user-menu { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--border); }
        .btn-sair { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

        .container { max-width: 1240px; margin: 26px auto; padding: 0 20px; width: 100%; flex: 1; }
        .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 22px; }
        .kpi { background: var(--card); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(15,23,42,.08); border-left: 5px solid; cursor: pointer; border: 1px solid var(--border); }
        .kpi.ativo { outline: 3px solid var(--primary); }
        .kpi .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; }
        .kpi .kpi-valor { font-size: 30px; font-weight: 800; margin-top: 4px; }
        .kpi.total { border-left-color: #1e3a8a; } .kpi.total .kpi-valor { color: #1e3a8a; }
        .kpi.pendente { border-left-color: #d97706; } .kpi.pendente .kpi-valor { color: #d97706; }
        .kpi.concluida { border-left-color: #16a34a; } .kpi.concluida .kpi-valor { color: #16a34a; }

        .filtros { background: var(--card); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(15,23,42,.08); display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border); }
        .filtros label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; text-transform: uppercase; }
        .filtros select { padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; min-width: 210px; background: var(--card); color: var(--text-main); }
        .btn-limpar { background: #e2e8f0; color: #475569; border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }

        .card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(15,23,42,.08); overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead th { background: var(--zebra); text-align: left; padding: 14px 16px; font-size: 11px; text-transform: uppercase; color: var(--text-light); border-bottom: 2px solid var(--border); }
        tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-main); }
        tbody tr:nth-child(even) { background: var(--zebra); }
        .codigo { font-weight: 700; color: var(--primary); }
        .venc-atrasado { color: #dc2626; font-weight: 700; }
        
        .status { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.pendente { background: #fef3c7; color: #92400e; }
        .status.em_elaboracao { background: #dbeafe; color: #1e40af; }
        .status.transmitida { background: #d1fae5; color: #065f46; }
        .status.validada { background: #dcfce7; color: #166534; }
        .status.rejeitada { background: #fee2e2; color: #991b1b; }
        .status.atrasada { background: #fee2e2; color: #991b1b; }

        .vazio { text-align: center; padding: 36px; color: var(--text-light); }
        .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 7px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn-transmitir { background: var(--secondary); }
        .btn-status { background: #475569; }

        .rodape { text-align: center; padding: 22px; color: var(--text-light); font-size: 12px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 2000; align-items: center; justify-content: center; }
        .modal-overlay.ativo { display: flex; }
        .modal { background: var(--card); border-radius: 14px; padding: 26px; width: 90%; max-width: 540px; box-shadow: 0 20px 50px rgba(15,23,42,.3); border: 1px solid var(--border); }
        .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--text-light); margin: 14px 0 5px; text-transform: uppercase; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; color: var(--text-main); background: var(--card); }
        .modal .botoes { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .btn-cancelar { background: #e2e8f0; color: #475569; }
        .btn-salvar { background: #16a34a; }
        .historico { margin-top: 8px; font-size: 12px; color: var(--text-light); }
        .historico .item { padding: 4px 0; border-top: 1px dashed var(--border); }
    </style>
</head>
<body>

<main class="main">
  <header class="header">
    <div class="header-title-wrapper">
      <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Home</a>
      <div class="header-title">📅 Calendário Fiscal</div>
    </div>
    <div class="header-right">
      <div class="empresa-selector" id="empresaSelector">
        <i class="fas fa-building"></i>
        <select id="selectEmpresa" onchange="trocarEmpresa()"></select>
      </div>
      <div class="date-time" id="current_datetime">--/--/----, --:--</div>
      <div class="user-menu">
        <i class="fas fa-user-circle" style="font-size:16px; color:var(--primary);"></i>
        <span id="userInfo">Utilizador</span>
      </div>
      <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
  </header>

  <div class="container">
    <div class="kpis">
      <div class="kpi total" onclick="filtrarPorStatus('total')"><div class="kpi-label">Total de obrigações</div><div class="kpi-valor" id="kpiTotal">—</div></div>
      <div class="kpi pendente" onclick="filtrarPorStatus('pendente')"><div class="kpi-label">Pendentes</div><div class="kpi-valor" id="kpiPendente">—</div></div>
      <div class="kpi concluida" onclick="filtrarPorStatus('concluida')"><div class="kpi-label">Transmitidas / Validadas</div><div class="kpi-valor" id="kpiConcluida">—</div></div>
    </div>
    <div class="filtros">
      <div><label>Empresa</label><select id="selectEmpresaHeader" onchange="sincronizarEmpresaHeader()"></select></div>
      <div><label>Competência</label><select id="selectCompetencia" onchange="carregarCalendario()"></select></div>
      <div><label>Tipo de documento</label><select id="selectTipo" onchange="carregarCalendario()"></select></div>
      <button class="btn-limpar" id="btnLimparFiltro" onclick="limparFiltros()" style="display:none;">✕ Limpar filtros</button>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Código</th><th>Obrigação</th><th>Órgão</th><th>Compet.</th>
            <th>Vencimento</th><th>Status</th><th>Transmissões</th><th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbodyCalendario"><tr><td colspan="8" class="vazio">Carregando...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="rodape">Sacramento ERP — Sistema de Gestão Empresarial de Alta Performance © 2026</div>
</main>

<div class="modal-overlay" id="modalTransmissao">
  <div class="modal">
    <h2>Registrar Transmissão</h2>
    <div id="modalInfo" style="font-size:13px; color:var(--text-light); margin-bottom:8px;"></div>
    <label>Status</label>
    <select id="modalStatus">
      <option value="transmitida">Transmitida</option>
      <option value="validada">Validada</option>
      <option value="rejeitada">Rejeitada</option>
    </select>
    <label>Nº do Protocolo</label>
    <input type="text" id="modalProtocolo" placeholder="Ex.: 2026.0001.123456">
    <label>Data da transmissão</label>
    <input type="date" id="modalData">
    <label>Arquivo do protocolo/comprovante</label>
    <input type="file" id="modalArquivo" accept=".pdf,.png,.jpg,.jpeg">
    <label>Observações</label>
    <textarea id="modalObs" placeholder="Observações da transmissão..."></textarea>
    <div class="botoes">
      <button class="btn btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-salvar" onclick="salvarTransmissao()">Salvar transmissão</button>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient('https://vcuhkvqrbkyulnnyqnbf.supabase.co', 'sb_publishable_Dee0dPFyiuzYkz8Zbx_hrA_RqSZeWei');
  const EMAIL_MASTER = 'lucianojorgesacramento@gmail.com';

  function obterUsuario() { try { return JSON.parse(localStorage.getItem('usuarioLogado') || 'null'); } catch(e){ return null; } }
  
  function ehMaster() {
      const u = obterUsuario();
      return !!(u && u.email && u.email.toLowerCase().trim() === EMAIL_MASTER.toLowerCase().trim());
  }

  function clienteIdAtual() {
      const u = obterUsuario();
      if (!u) return 1;
      if (ehMaster()) {
          try { const sel = localStorage.getItem('empresaSelecionada'); if (sel) return parseInt(sel); } catch(e) {}
          return u.cliente_id ? parseInt(u.cliente_id) : 1;
      }
      // Trava LGPD: Retorna estritamente o ID da empresa do utilizador comum
      return u.cliente_id ? parseInt(u.cliente_id) : 1;
  }

  const ROTULOS_STATUS = { pendente:'Pendente', em_elaboracao:'Em elaboração', transmitida:'Transmitida', validada:'Validada', rejeitada:'Rejeitada', atrasada:'Atrasada' };
  let contextoAtual = null;
  let filtroStatus = null;
  
  function formatarData(d) { if(!d) return '—'; const p=String(d).split('-'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : d; }
  function formatarDataHora(d) { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

  function sair() {
      if (confirm('Deseja realmente sair do sistema?')) { 
          localStorage.removeItem('usuarioLogado'); 
          localStorage.removeItem('empresaSelecionada'); 
          location.href = 'login.html'; 
      }
  }

  setInterval(() => {
      let now = new Date();
      const dt = document.getElementById('current_datetime');
      if(dt) dt.innerText = now.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }, 1000);

  async function carregarEmpresas() {
    const u = obterUsuario();
    if (u) {
        const elUser = document.getElementById('userInfo');
        if (elUser) elUser.innerText = (u.nome || u.email || 'Utilizador').split('@')[0];
    }

    const select = document.getElementById('selectEmpresa');
    const selectHeader = document.getElementById('selectEmpresaHeader');
    select.innerHTML = '<option value="">Carregando...</option>';
    selectHeader.innerHTML = '<option value="">Carregando...</option>';
    
    let empresas = [];
    try {
      if (ehMaster()) {
          const { data } = await sb.from('clientes_contratantes').select('id, razao_social, nome_fantasia').order('id');
          empresas = data || [];
          select.disabled = false;
          selectHeader.disabled = false;
      } else {
          const cid = clienteIdAtual();
          if (cid) {
              const { data } = await sb.from('clientes_contratantes').select('id, razao_social, nome_fantasia').eq('id', cid);
              empresas = data || [];
          }
          select.disabled = true; // Trava absoluta LGPD
          selectHeader.disabled = true; // Trava absoluta LGPD
      }
    } catch(e) { console.error('Erro ao carregar empresas:', e); }

    if (empresas.length === 0) {
      select.innerHTML = '<option value="">Nenhuma empresa encontrada</option>';
      selectHeader.innerHTML = '<option value="">Nenhuma empresa encontrada</option>';
      await carregarCompetencias();
      return;
    }

    select.innerHTML = '';
    selectHeader.innerHTML = '';
    empresas.forEach(emp => {
      const nomeEmp = emp.nome_fantasia || emp.razao_social || ('Empresa ' + emp.id);
      const o1 = document.createElement('option'); o1.value = emp.id; o1.textContent = nomeEmp; select.appendChild(o1);
      const o2 = document.createElement('option'); o2.value = emp.id; o2.textContent = nomeEmp; selectHeader.appendChild(o2);
    });

    const cidSeguro = clienteIdAtual();
    if (cidSeguro && [...select.options].some(o => parseInt(o.value) === cidSeguro)) {
      select.value = cidSeguro;
      selectHeader.value = cidSeguro;
    } else {
      select.value = select.options[0].value;
      selectHeader.value = select.options[0].value;
      if (ehMaster()) localStorage.setItem('empresaSelecionada', select.value);
    }
    
    await carregarCompetencias();
  }

  function sincronizarEmpresaHeader() {
      if (!ehMaster()) return;
      const val = document.getElementById('selectEmpresaHeader').value;
      document.getElementById('selectEmpresa').value = val;
      localStorage.setItem('empresaSelecionada', String(val));
      carregarCompetencias();
  }

  function trocarEmpresa() {
      if (!ehMaster()) return;
      const val = document.getElementById('selectEmpresa').value;
      document.getElementById('selectEmpresaHeader').value = val;
      localStorage.setItem('empresaSelecionada', String(val));
      carregarCompetencias();
  }

  async function carregarCompetencias() {
    const clienteId = clienteIdAtual();
    const select = document.getElementById('selectCompetencia');
    select.innerHTML = '<option value="">Todas</option>';
    if (!clienteId) { await carregarTipos(); await carregarCalendario(); return; }
    const { data } = await sb.from('calendario_fiscal').select('competencia').eq('cliente_id', clienteId).order('competencia', { ascending: false });
    const vistos = new Set();
    (data || []).forEach(r => { if (!vistos.has(r.competencia)) { vistos.add(r.competencia); const o = document.createElement('option'); o.value = r.competencia; o.textContent = r.competencia; select.appendChild(o); } });
    await carregarTipos();
    await carregarCalendario();
  }

  async function carregarTipos() {
    const clienteId = clienteIdAtual();
    const select = document.getElementById('selectTipo');
    select.innerHTML = '<option value="">Todos os documentos</option>';
    if (!clienteId) return;
    const { data } = await sb.from('calendario_fiscal')
      .select('obrigacoes_fiscais(codigo, descricao)')
      .eq('cliente_id', clienteId);
    const vistos = new Set();
    (data || []).forEach(r => {
      const o = r.obrigacoes_fiscais || {};
      const codigo = o.codigo || '—';
      if (!vistos.has(codigo)) {
        vistos.add(codigo);
        const opt = document.createElement('option');
        opt.value = codigo;
        opt.textContent = codigo + ' — ' + (o.descricao || '');
        select.appendChild(opt);
      }
    });
  }

  function filtrarPorStatus(tipo) {
    filtroStatus = (filtroStatus === tipo) ? null : tipo;
    document.querySelectorAll('.kpi').forEach(k => k.classList.remove('ativo'));
    if (filtroStatus) document.querySelector('.kpi.' + (filtroStatus==='total'?'total':filtroStatus==='pendente'?'pendente':'concluida')).classList.add('ativo');
    atualizarBotaoLimpar();
    carregarCalendario();
  }
  function limparFiltros() {
    filtroStatus = null;
    document.querySelectorAll('.kpi').forEach(k => k.classList.remove('ativo'));
    document.getElementById('selectTipo').value = '';
    document.getElementById('selectCompetencia').value = '';
    atualizarBotaoLimpar();
    carregarCalendario();
  }
  function atualizarBotaoLimpar() {
    const temStatus = !!filtroStatus;
    const temTipo = !!document.getElementById('selectTipo').value;
    const temComp = !!document.getElementById('selectCompetencia').value;
    document.getElementById('btnLimparFiltro').style.display = (temStatus || temTipo || temComp) ? 'inline-block' : 'none';
  }

  async function carregarCalendario() {
    const clienteId = clienteIdAtual();
    const competencia = document.getElementById('selectCompetencia').value;
    const tipo = document.getElementById('selectTipo').value;
    const tbody = document.getElementById('tbodyCalendario');
    tbody.innerHTML = '<tr><td colspan="8" class="vazio">Carregando...</td></tr>';
    if (!clienteId) { tbody.innerHTML = '<tr><td colspan="8" class="vazio">Empresa não identificada ou sem permissão.</td></tr>'; limparKpis(); return; }
    
    let q = sb.from('calendario_fiscal').select('id, competencia, data_vencimento, status, responsavel, observacoes, obrigacoes_fiscais(codigo, descricao, orgao)').eq('cliente_id', clienteId);
    if (competencia) q = q.eq('competencia', competencia);
    if (tipo) q = q.eq('obrigacoes_fiscais.codigo', tipo);
    q = q.order('data_vencimento');
    const { data, error } = await q;
    if (error) { tbody.innerHTML = '<tr><td colspan="8" class="vazio">Erro: ' + error.message + '</td></tr>'; return; }
    if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="vazio">Nenhuma obrigação encontrada.</td></tr>'; limparKpis(); return; }
    const total = data.length;
    const pendentes = data.filter(i => (i.status||'pendente')==='pendente' || (i.status||'')==='em_elaboracao' || (i.status||'')==='atrasada').length;
    const concluidas = data.filter(i => (i.status||'')==='transmitida' || (i.status||'')==='validada').length;
    document.getElementById('kpiTotal').textContent = total;
    document.getElementById('kpiPendente').textContent = pendentes;
    document.getElementById('kpiConcluida').textContent = concluidas;
    let lista = data;
    if (filtroStatus === 'pendente') lista = data.filter(i => (i.status||'pendente')==='pendente' || (i.status||'')==='em_elaboracao' || (i.status||'')==='atrasada');
    if (filtroStatus === 'concluida') lista = data.filter(i => (i.status||'')==='transmitida' || (i.status||'')==='validada');
    tbody.innerHTML = '';
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    for (const item of lista) {
      const o = item.obrigacoes_fiscais || {};
      const tr = document.createElement('tr');
      const venc = item.data_vencimento ? new Date(item.data_vencimento + 'T00:00:00') : null;
      const atrasado = venc && venc < hoje && (item.status||'pendente')!=='transmitida' && (item.status||'')!=='validada';
      tr.innerHTML =
        '<td><span class="codigo">' + (o.codigo || '—') + '</span></td>' +
        '<td>' + (o.descricao || '—') + '</td>' +
        '<td>' + (o.orgao || '—') + '</td>' +
        '<td>' + item.competencia + '</td>' +
        '<td class="' + (atrasado ? 'venc-atrasado' : '') + '">' + formatarData(item.data_vencimento) + (atrasado ? ' ⚠' : '') + '</td>' +
        '<td><span class="status ' + (item.status || 'pendente') + '">' + (ROTULOS_STATUS[item.status] || item.status || 'Pendente') + '</span></td>' +
        '<td class="historico" id="hist-' + item.id + '">Carregando...</td>' +
        '<td><div class="acoes">' +
          '<button class="btn btn-transmitir" onclick="abrirTransmissao(' + item.id + ',' + clienteId + ',\'' + item.competencia + '\',\'' + (o.codigo || '') + '\')">Transmitir</button>' +
          '<button class="btn btn-status" onclick="mudarStatus(' + item.id + ')">Status</button>' +
        '</div></td>';
      tbody.appendChild(tr);
      carregarHistorico(item.id, clienteId);
    }
  }

  function limparKpis() { document.getElementById('kpiTotal').textContent='—'; document.getElementById('kpiPendente').textContent='—'; document.getElementById('kpiConcluida').textContent='—'; }

  async function carregarHistorico(calId, clienteId) {
    const el = document.getElementById('hist-' + calId);
    const { data } = await sb.from('transmissoes_obrigacoes').select('*').eq('cliente_id', clienteId).order('data_transmissao', { ascending: false });
    const lista = (data || []).filter(t => t.competencia === document.getElementById('selectCompetencia').value || !document.getElementById('selectCompetencia').value);
    if (!lista || lista.length === 0) { el.innerHTML = '<div class="item">Sem transmissões</div>'; return; }
    el.innerHTML = lista.map(t =>
      '<div class="item">' + formatarDataHora(t.data_transmissao) + ' · ' + (ROTULOS_STATUS[t.status] || t.status) +
      (t.protocolo_numero ? ' · Nº ' + t.protocolo_numero : '') +
      (t.arquivo_url ? ' · <a href="' + t.arquivo_url + '" target="_blank">Ver</a>' : '') +
      '</div>').join('');
  }

  function abrirTransmissao(calId, clienteId, competencia, codigo) {
    contextoAtual = { calId, clienteId, competencia, codigo };
    document.getElementById('modalInfo').textContent = 'Obrigação: ' + codigo + ' · Competência: ' + competencia;
    document.getElementById('modalProtocolo').value = '';
    document.getElementById('modalObs').value = '';
    document.getElementById('modalData').value = new Date().toISOString().split('T')[0];
    document.getElementById('modalArquivo').value = '';
    document.getElementById('modalStatus').value = 'transmitida';
    document.getElementById('modalTransmissao').classList.add('ativo');
  }
  function fecharModal() { document.getElementById('modalTransmissao').classList.remove('ativo'); }

  async function salvarTransmissao() {
    if (!contextoAtual) return;
    const status = document.getElementById('modalStatus').value;
    const protocolo = document.getElementById('modalProtocolo').value.trim();
    const obs = document.getElementById('modalObs').value.trim();
    const data = document.getElementById('modalData').value;
    const arquivo = document.getElementById('modalArquivo').files[0];
    const responsavel = (obterUsuario() && (obterUsuario().nome || obterUsuario().email)) || 'Utilizador';
    let arquivoUrl = null, arquivoNome = null;
    if (arquivo) {
      const path = contextoAtual.clienteId + '/' + contextoAtual.competencia + '/' + Date.now() + '_' + arquivo.name;
      const { error: upErr } = await sb.storage.from('protocolos').upload(path, arquivo);
      if (upErr) { alert('Erro ao enviar arquivo: ' + upErr.message); return; }
      const { data: pub } = sb.storage.from('protocolos').getPublicUrl(path);
      arquivoUrl = pub.publicUrl; arquivoNome = arquivo.name;
    }
    const { error } = await sb.from('transmissoes_obrigacoes').insert({
      cliente_id: contextoAtual.clienteId, competencia: contextoAtual.competencia,
      data_transmissao: data ? new Date(data + 'T12:00:00').toISOString() : new Date().toISOString(),
      status, protocolo_numero: protocolo, arquivo_url: arquivoUrl, arquivo_nome: arquivoNome,
      responsavel, observacoes: obs
    });
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    await sb.from('calendario_fiscal').update({ status, atualizado_em: new Date().toISOString() }).eq('id', contextoAtual.calId);
    fecharModal();
    await carregarCalendario();
  }

  async function mudarStatus(calId) {
    const opcoes = ['pendente','em_elaboracao','transmitida','validada','atrasada'];
    const escolha = prompt('Escolha o novo status:\n\n1 - Pendente\n2 - Em elaboração\n3 - Transmitida\n4 - Validada\n5 - Atrasada\n\nDigite o número (1 a 5):');
    if (!escolha) return;
    const idx = parseInt(escolha, 10);
    if (isNaN(idx) || idx < 1 || idx > 5) { alert('Opção inválida.'); return; }
    const novo = opcoes[idx - 1];
    const { error } = await sb.from('calendario_fiscal').update({ status: novo, atualizado_em: new Date().toISOString() }).eq('id', calId);
    if (error) { alert('Erro: ' + error.message); return; }
    await carregarCalendario();
  }

  carregarEmpresas();
</script>
</body>
</html>
